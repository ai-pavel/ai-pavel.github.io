<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🗝️ Address from Key</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%97%9D%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>🗝️ Address from Key</h1>
  <p class="lead">Derive the public key and address of a private key, or the address of a public key.</p>

  <div class="panel">
    <p class="warning">Runs locally in your browser. Don't paste keys that hold real funds.</p>
    <div class="field">
      <label for="key" class="muted">Private key (32 bytes) or public key (33, 64 or 65 bytes)</label>
      <textarea id="key" class="mono" rows="2" spellcheck="false" autocomplete="off" placeholder="0x…"></textarea>
    </div>
    <div class="row"><button id="random">Random private key</button></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser.</span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { hexToBytes, bytesToHex, secp256k1, parsePrivateKey, parsePublicKey, addressFromPoint, InputError } from '../lib/evm.js';
import { $, renderRows, live } from '../lib/ui.js';

const run = live([$('key')], () => {
  const raw = $('key').value.trim();
  if (!raw) { $('out').innerHTML = ''; return; }
  const b = hexToBytes(raw, 'Key');
  let point, priv = null;
  if (b.length === 32) { priv = parsePrivateKey(raw); point = secp256k1.ProjectivePoint.fromPrivateKey(priv); }
  else if ([33, 64, 65].includes(b.length)) point = parsePublicKey(b);
  else throw new InputError(`Expected 32 bytes (private key) or 33/64/65 bytes (public key), got ${b.length}`);
  renderRows($('out'), [
    { label: 'Address', value: addressFromPoint(point) },
    { label: 'Key type', value: priv ? 'Private key' : 'Public key', copy: false },
    { label: 'Public key (compressed)', value: bytesToHex(point.toRawBytes(true)) },
    { label: 'Public key (uncompressed)', value: bytesToHex(point.toRawBytes(false)) },
  ]);
}, { errEl: $('err'), outEl: $('out') });

$('random').onclick = () => {
  $('key').value = bytesToHex(secp256k1.utils.randomPrivateKey());
  run();
};
</script>
</body>
</html>
