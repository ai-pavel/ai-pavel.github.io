<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Message</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%8D%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/sol.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Solana</a>
  <h1>✍️ Sign Message</h1>
  <p class="lead">Sign a message with an ed25519 secret key. Signs the raw message bytes, like a wallet's <code>signMessage</code>.</p>

  <div class="panel">
    <label class="field">Secret key: base58, JSON byte array or hex (32-byte seed or 64-byte keypair)
      <textarea id="secret" class="wide" rows="3" spellcheck="false" autocomplete="off"></textarea>
    </label>
    <div class="row" style="margin-top:8px"><button id="gen">Generate a test key</button></div>
    <label class="field">Message
      <textarea id="msg" class="wide" rows="4" spellcheck="false">Hello, Solana!</textarea>
    </label>
    <label class="field">Message encoding
      <select id="enc"><option value="utf8">Text (UTF-8)</option><option value="hex">Hex</option><option value="base58">Base58</option><option value="base64">Base64</option></select>
    </label>
    <p class="error" id="err" hidden></p>
    <div id="out"></div>
    <p class="note">Runs locally in your browser. Don't paste keys that hold real funds.</p>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline.</span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { ed25519, parseSecret, parseBytes, keypairFromSeed, base58, base64, hex, kvTable, wireCopy, showError } from '../lib/sol.js';
const $ = id => document.getElementById(id);
function render() {
  $('out').innerHTML = '';
  if (!$('secret').value.trim()) return showError($('err'));
  try {
    const kp = parseSecret($('secret').value);
    const msg = parseBytes($('msg').value, $('enc').value);
    const sig = ed25519.sign(msg, kp.seed);
    showError($('err'), kp.mismatch ? 'Warning: the public-key half of this 64-byte key does not match its seed. Signing uses the seed.' : '');
    $('out').innerHTML = kvTable([
      ['Public key', base58.encode(kp.publicKey)],
      ['Signature (base58)', base58.encode(sig)],
      ['Signature (hex)', hex.encode(sig)],
      ['Signature (base64)', base64.encode(sig)],
      ['Message bytes', `${msg.length} bytes`],
    ]);
  } catch (e) { showError($('err'), e.message); }
}
['secret', 'msg'].forEach(id => $(id).oninput = render);
$('enc').onchange = render;
$('gen').onclick = () => { $('secret').value = base58.encode(keypairFromSeed(crypto.getRandomValues(new Uint8Array(32))).secretKey); render(); };
wireCopy();
</script>
</body>
</html>
