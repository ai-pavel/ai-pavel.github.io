<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorem Ipsum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9D</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>📝 Lorem Ipsum</h1>
  <p class="lead">Generate placeholder text.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="toolbar">
      <label>Generate <input type="number" id="count" min="1" max="500" value="3" style="width:80px"></label>
      <label><select id="unit"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select></label>
      <label><input type="checkbox" id="classic" checked> Start with "Lorem ipsum dolor sit amet…"</label>
      <label><input type="checkbox" id="html"> Wrap paragraphs in &lt;p&gt;</label>
      <button class="primary" id="gen">Regenerate</button>
    </div>
    <textarea id="out" class="mono" rows="14" readonly></textarea>
    <div class="row" style="margin-top:6px"><button data-copy-from="out">Copy</button><span class="muted" id="stats"></span></div>
  </div>
  <script type="module">
import { $ } from '../lib/ui.js';

const WORDS = ('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum ' +
  'praesent elementum facilisis leo vel fringilla tellus mauris pharetra et ultrices neque ornare aenean euismod nisl tincidunt eget nullam vehicula ipsum a arcu cursus vitae congue mauris rhoncus aenean vel purus semper eget duis at tellus ac felis donec').split(' ');
const CLASSIC = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';
const rnd = n => Math.floor(Math.random() * n);
const word = () => WORDS[rnd(WORDS.length)];
function sentence() {
  const n = 6 + rnd(12), w = Array.from({ length: n }, word);
  if (n > 9 && rnd(2)) w[3 + rnd(n - 6)] += ',';
  const s = w.join(' ');
  return s[0].toUpperCase() + s.slice(1) + '.';
}
const paragraph = () => Array.from({ length: 4 + rnd(4) }, sentence).join(' ');
function generate() {
  const n = Math.max(1, Math.min(500, +$('count').value || 1)), unit = $('unit').value, classic = $('classic').checked;
  let text;
  if (unit === 'words') {
    const w = Array.from({ length: n }, word);
    if (classic) CLASSIC.replace(/[,.]/g, '').toLowerCase().split(' ').slice(0, n).forEach((x, i) => { w[i] = x; });
    text = w.join(' '); text = text[0].toUpperCase() + text.slice(1) + '.';
  } else if (unit === 'sentences') {
    const s = Array.from({ length: n }, sentence); if (classic) s[0] = CLASSIC; text = s.join(' ');
  } else {
    const p = Array.from({ length: n }, paragraph); if (classic) p[0] = CLASSIC + ' ' + p[0];
    text = $('html').checked ? p.map(x => `<p>${x}</p>`).join('\n') : p.join('\n\n');
  }
  $('out').value = text;
  $('stats').textContent = `${text.split(/\s+/).filter(Boolean).length} words · ${text.length} characters`;
}
$('gen').onclick = generate;
for (const id of ['count', 'unit', 'classic', 'html']) $(id).addEventListener('input', generate);
generate();
  </script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>

</body>
</html>
