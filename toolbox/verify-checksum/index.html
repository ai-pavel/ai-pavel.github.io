<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✅ Verify Checksum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%85</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 28px 16px; text-align: center; color: var(--muted); }
    .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .drop .row { justify-content: center; margin-top: 12px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .hashes td:first-child { white-space: nowrap; width: 1%; color: var(--muted); }
    .hashes td.mono { word-break: break-all; font-size: 14px; }
    .hashes td:last-child { width: 1%; }
    .hashes tr.match td { background: color-mix(in srgb, #1e8e3e 14%, transparent); }
    .hashes tr.mismatch td { background: color-mix(in srgb, #c0392b 12%, transparent); }
    .verdict { font-weight: 600; margin: 12px 0 0; }
    .verdict.ok { color: #1e8e3e; }
    .verdict.bad { color: #c0392b; }
    progress { width: 100%; margin-top: 12px; }
    .wide { width: 100%; }
  </style>
</head>
<body>
<main>
  <a class="back" href="../">← All tools</a>
  <h1>✅ Verify Checksum</h1>
  <p class="lead">Compute MD5, SHA-1, SHA-256 and SHA-512 of a file or text, and compare with an expected hash.</p>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="file">File</button>
      <button role="tab" aria-selected="false" data-tab="text">Text</button>
    </div>

    <div id="tab-file">
      <div class="drop" id="drop">
        Drop a file here
        <div class="row"><button id="pick">Choose file</button></div>
        <input type="file" id="file" hidden>
      </div>
      <p class="muted" id="fileinfo"></p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </div>
    <div id="tab-text" hidden>
      <textarea id="text" rows="5" class="wide" style="resize:vertical" placeholder="Type or paste text (hashed as UTF-8)"></textarea>
    </div>

    <label class="wide" style="margin-top:16px">Expected hash (optional)
      <input id="expected" class="mono" placeholder="Paste a checksum to compare" autocomplete="off" spellcheck="false">
    </label>
    <p class="verdict" id="verdict"></p>

    <table class="hashes" id="table" hidden><tbody></tbody></table>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.12.0/dist/index.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
const ALGOS = [
  ['MD5', () => hashwasm.createMD5(), 32],
  ['SHA-1', () => hashwasm.createSHA1(), 40],
  ['SHA-256', () => hashwasm.createSHA256(), 64],
  ['SHA-512', () => hashwasm.createSHA512(), 128],
];
const CHUNK = 4 * 1024 * 1024;
let results = null, job = 0;

async function hashSource(src, onProgress) {
  const hashers = await Promise.all(ALGOS.map(([, make]) => make()));
  hashers.forEach(h => h.init());
  if (src instanceof Blob) {
    for (let off = 0; off < src.size; off += CHUNK) {
      const chunk = new Uint8Array(await src.slice(off, off + CHUNK).arrayBuffer());
      hashers.forEach(h => h.update(chunk));
      onProgress && onProgress(Math.min(1, (off + CHUNK) / src.size));
    }
  } else hashers.forEach(h => h.update(new TextEncoder().encode(src)));
  return hashers.map(h => h.digest('hex'));
}

function normalize(s) { return s.trim().split(/\s+/)[0]?.toLowerCase().replace(/^(md5|sha1|sha-1|sha256|sha-256|sha512|sha-512)[:=]/, '') || ''; }
function render() {
  if (!results) { $('table').hidden = true; $('verdict').textContent = ''; return; }
  const exp = normalize($('expected').value);
  const target = exp ? ALGOS.findIndex(a => a[2] === exp.length) : -1;
  $('table').hidden = false;
  $('table').tBodies[0].innerHTML = ALGOS.map(([name], i) => {
    const cls = i === target ? (results[i] === exp ? 'match' : 'mismatch') : '';
    return `<tr class="${cls}"><td>${name}</td><td class="mono">${results[i]}</td><td><button class="icon-btn" data-copy="${i}" title="Copy">Copy</button></td></tr>`;
  }).join('');
  const v = $('verdict');
  if (!exp) { v.textContent = ''; v.className = 'verdict'; }
  else if (!/^[0-9a-f]+$/.test(exp) || target < 0) { v.textContent = 'Unrecognized hash: expected 32 (MD5), 40 (SHA-1), 64 (SHA-256) or 128 (SHA-512) hex characters.'; v.className = 'verdict bad'; }
  else if (results[target] === exp) { v.textContent = `✅ Match (${ALGOS[target][0]})`; v.className = 'verdict ok'; }
  else { v.textContent = `❌ Mismatch (${ALGOS[target][0]}). The file is not the one you expected.`; v.className = 'verdict bad'; }
}

async function hashFile(file) {
  if (!file) return;
  const id = ++job;
  results = null; render();
  $('fileinfo').textContent = `${file.name} · ${fmtSize(file.size)}`;
  $('progress').hidden = false; $('progress').value = 0;
  const r = await hashSource(file, p => { if (id === job) $('progress').value = p; });
  if (id !== job) return;
  $('progress').hidden = true; results = r; render();
}
let textTimer;
function hashText() {
  clearTimeout(textTimer);
  textTimer = setTimeout(async () => {
    const id = ++job, r = await hashSource($('text').value);
    if (id === job) { results = r; render(); }
  }, 150);
}

document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('tab-file').hidden = b.dataset.tab !== 'file'; $('tab-text').hidden = b.dataset.tab !== 'text';
  job++; results = null; $('progress').hidden = true; render();
  if (b.dataset.tab === 'text') hashText(); else $('fileinfo').textContent = '';
});
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); hashFile(e.dataTransfer.files[0]); });
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { hashFile(e.target.files[0]); e.target.value = ''; };
$('text').oninput = hashText;
$('expected').oninput = render;
$('table').onclick = async e => {
  const i = e.target.dataset.copy;
  if (i === undefined) return;
  try { await navigator.clipboard.writeText(results[+i]); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1500); } catch {}
};
</script>
</body>
</html>
