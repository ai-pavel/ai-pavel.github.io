<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Message</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%94%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>✔️ Verify Message</h1>
  <p class="lead">Recover the address that signed a message with <code>personal_sign</code> (EIP-191), and check it against the address you expect.</p>

  <div class="panel">
    <div class="field">
      <label for="msg" class="muted">Message</label>
      <textarea id="msg" rows="3" spellcheck="false"></textarea>
    </div>
    <label class="field inline-check"><input type="checkbox" id="is-hex"> Message is hex bytes</label>
    <div class="field">
      <label for="sig" class="muted">Signature (65 bytes, or 64-byte EIP-2098 compact)</label>
      <textarea id="sig" class="mono" rows="2" spellcheck="false" placeholder="0x…"></textarea>
    </div>
    <div class="field">
      <label for="addr" class="muted">Expected signer (optional)</label>
      <input id="addr" class="mono" spellcheck="false" autocomplete="off" placeholder="0x…">
    </div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="status" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { parseEcdsaSignature, recoverAddress, personalMessageHash, parseAddress, hexToBytes, bytesToHex, utf8 } from '../lib/evm.js';
import { $, renderRows, live, param } from '../lib/ui.js';

$('msg').value = param('msg') ?? 'Hello, Ethereum!';
$('is-hex').checked = param('hex') === '1';
$('sig').value = param('sig') ?? '';
$('addr').value = param('addr') ?? '';

live([$('msg'), $('is-hex'), $('sig'), $('addr')], () => {
  $('status').hidden = true;
  if (!$('sig').value.trim()) { $('out').innerHTML = ''; return; }
  const msg = $('is-hex').checked ? hexToBytes($('msg').value, 'Message') : utf8($('msg').value);
  const hash = personalMessageHash(msg);
  const signer = recoverAddress(hash, parseEcdsaSignature($('sig').value));
  if ($('addr').value.trim()) {
    const expected = parseAddress($('addr').value, 'Expected signer');
    const match = expected === signer;
    $('status').className = 'status ' + (match ? 'ok' : 'bad');
    $('status').textContent = match ? '✅ Signature is valid for this address' : '❌ Signed by a different address';
    $('status').hidden = false;
  }
  renderRows($('out'), [
    { label: 'Recovered signer', value: signer },
    { label: 'Message hash', value: bytesToHex(hash) },
  ]);
}, { errEl: $('err'), outEl: $('out') });
</script>
</body>
</html>
