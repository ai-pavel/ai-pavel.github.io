<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base64</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%A6</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
    .drop.over { border-color: var(--accent); color: var(--accent); }
    .preview img { max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 12px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>📦 Base64</h1>
  <p class="lead">Encode and decode Base64 text and files.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="encode" aria-pressed="true">Text → Base64</button>
      <button data-mode="decode" aria-pressed="false">Base64 → text / file</button>
      <button data-mode="file" aria-pressed="false">File → Base64</button>
    </div>
    <div id="textPane">
      <div class="field"><span id="inLabel">Text</span><textarea id="in" class="mono" rows="6" spellcheck="false">Hello, world! 👋</textarea></div>
      <div class="toolbar" id="encOpts">
        <label><input type="checkbox" id="url"> URL-safe (base64url)</label>
        <label><input type="checkbox" id="pad" checked> Padding (=)</label>
        <label><input type="checkbox" id="wrap"> Wrap at 76 characters (MIME)</label>
      </div>
    </div>
    <div id="filePane" hidden>
      <label class="drop" id="drop"><input type="file" id="file" hidden>Drop a file here or click to choose one</label>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
    <div class="row" id="dlRow" hidden style="margin-top:12px"><button id="download">Download decoded bytes</button></div>
    <div class="preview" id="preview"></div>
  </div>
  <script type="module">
import { $, renderRows, segmented, showError, esc } from '../lib/ui.js';
import { toBase64, fromBase64, utf8, utf8OrNull, printable, toHex } from '../lib/bytes.js';

let decoded = null;
const mode = segmented($('mode'), m => {
  $('textPane').hidden = m === 'file'; $('filePane').hidden = m !== 'file';
  $('encOpts').hidden = m !== 'encode';
  $('inLabel').textContent = m === 'encode' ? 'Text' : 'Base64 or base64url';
  if (m === 'decode' && !/^[A-Za-z0-9+/=_\-\s]+$/.test($('in').value)) $('in').value = 'SGVsbG8sIHdvcmxkISDwn5GL';
  $('out').innerHTML = ''; $('preview').innerHTML = ''; $('dlRow').hidden = true;
  if (m !== 'file') run();
});
const wrap76 = s => $('wrap').checked ? s.replace(/(.{76})/g, '$1\n').trim() : s;
function run() {
  showError($('err'), null); $('preview').innerHTML = ''; $('dlRow').hidden = true;
  try {
    if (mode() === 'encode') {
      const bytes = utf8($('in').value);
      renderRows($('out'), [
        { label: $('url').checked ? 'Base64url' : 'Base64', value: wrap76(toBase64(bytes, { url: $('url').checked, pad: $('pad').checked })) },
        { label: 'Size', value: `${bytes.length} bytes → ${toBase64(bytes, { url: $('url').checked, pad: $('pad').checked }).length} characters`, copy: false },
      ]);
    } else if (mode() === 'decode') {
      if (!$('in').value.trim()) { $('out').innerHTML = ''; return; }
      const bytes = fromBase64($('in').value.replace(/^data:[^,]*;base64,/, ''));
      decoded = bytes;
      const text = utf8OrNull(bytes);
      renderRows($('out'), [
        text !== null && printable(text) ? { label: 'Text (UTF-8)', value: text } : { label: 'Text', value: 'Not readable text (binary data); see hex below.', copy: false },
        { label: 'Hex', value: toHex(bytes, ' ').slice(0, 30000) + (bytes.length > 10000 ? ' …' : '') },
        { label: 'Size', value: `${bytes.length} bytes`, copy: false },
      ]);
      $('dlRow').hidden = false;
    }
  } catch (e) { $('out').innerHTML = ''; showError($('err'), e); }
}
for (const id of ['in', 'url', 'pad', 'wrap']) $(id).addEventListener('input', run);
$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([decoded])); a.download = 'decoded.bin'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
async function useFile(f) {
  const bytes = new Uint8Array(await f.arrayBuffer());
  const b64 = toBase64(bytes);
  const uri = `data:${f.type || 'application/octet-stream'};base64,${b64}`;
  renderRows($('out'), [
    { label: 'File', value: `${f.name} · ${f.type || 'unknown type'} · ${bytes.length} bytes`, copy: false },
    { label: 'Base64', value: b64 },
    { label: 'Data URI', value: uri },
  ]);
  $('preview').innerHTML = f.type.startsWith('image/') ? `<img alt="${esc(f.name)}" src="${uri}">` : '';
}
$('file').addEventListener('input', () => $('file').files[0] && useFile($('file').files[0]));
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && useFile(e.dataTransfer.files[0]); });
run();
  </script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
</body>
</html>
