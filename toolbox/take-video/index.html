<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📹 Take Video</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%B9</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; display: grid; place-items: center; }
    .stage video { width: 100%; height: 100%; object-fit: contain; }
    .stage video.mirror { transform: scaleX(-1); }
    .rec { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff;
      font: 600 14px/1.4 ui-monospace, Menlo, monospace; }
    .rec::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; background: #e5484d; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .placeholder-msg { color: #bbb; padding: 16px; text-align: center; }
    .switch { flex-direction: row; align-items: center; gap: 6px; }
    button.stop { background: #e5484d; border-color: #e5484d; color: #fff; }
    .clip { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
    .clip video { width: 100%; border-radius: 8px; background: #000; }
    .clip .row { justify-content: space-between; flex-wrap: nowrap; }
    .error { color: #d14343; }
  </style>
</head>
<body>
<main>
  <a class="back" href="../">← All tools</a>
  <h1>📹 Take Video</h1>
  <p class="lead">Record video from your webcam and microphone. Clips stay on your device until you download them.</p>

  <div class="panel">
    <div class="stage">
      <video id="preview" autoplay playsinline muted class="mirror" hidden></video>
      <p class="placeholder-msg" id="msg">Turn on the camera to start.</p>
      <div class="rec" id="rec" hidden>00:00</div>
    </div>
    <p class="error" id="error" hidden></p>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="power">Turn on camera</button>
      <button class="primary" id="record" hidden>⏺ Record</button>
      <select id="camera" hidden title="Camera"></select>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="mirror" checked> Mirror preview</label>
      <label class="switch"><input type="checkbox" id="mic" checked> Record sound</label>
      <span class="muted" id="format"></span>
    </div>
    <div class="list" id="clips"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const preview = $('preview');
let stream = null, recorder = null, chunks = [], startedAt = 0, timer = null;

const TYPES = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
const mime = window.MediaRecorder ? TYPES.find(t => MediaRecorder.isTypeSupported(t)) || '' : '';
const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
$('format').textContent = window.MediaRecorder ? `Saves as ${ext.toUpperCase()}` : '';

function showError(text) { $('error').textContent = text; $('error').hidden = !text; }
function explain(err) {
  if (err.name === 'NotAllowedError') return 'Camera or microphone access was blocked. Allow them for this site in your browser settings and try again.';
  if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') return 'No camera was found. Connect a camera and try again.';
  if (err.name === 'NotReadableError') return 'The camera or microphone is in use by another app. Close it and try again.';
  return 'Could not start the camera: ' + err.message;
}
const pad = n => String(n).padStart(2, '0');
const fmt = ms => { const t = Math.floor(ms / 1000); return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };

async function listCameras() {
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
  $('camera').innerHTML = cams.map((c, i) => `<option value="${esc(c.deviceId)}">${esc(c.label || 'Camera ' + (i + 1))}</option>`).join('');
  if (current) $('camera').value = current;
  $('camera').hidden = cams.length < 2;
}
function stop() {
  if (recorder?.state === 'recording') recorder.stop();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  preview.srcObject = null; preview.hidden = true; $('msg').hidden = false;
  $('record').hidden = true; $('camera').hidden = true; $('power').textContent = 'Turn on camera';
}
async function start(deviceId) {
  showError('');
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    showError('Your browser does not support video recording here. Use a recent browser over HTTPS.'); return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: $('mic').checked,
    });
    stream?.getTracks().forEach(t => t.stop());
    stream = s; preview.srcObject = s; preview.hidden = false; $('msg').hidden = true;
    $('record').hidden = false; $('power').textContent = 'Turn off camera';
    await listCameras();
  } catch (err) { stop(); showError(explain(err)); }
}

function addClip(blob, duration) {
  const url = URL.createObjectURL(blob), stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const el = document.createElement('div');
  el.className = 'clip';
  el.innerHTML = `<video controls playsinline src="${url}"></video>
    <div class="row"><span class="muted">${fmt(duration)} · ${(blob.size / 1048576).toFixed(1)} MB</span>
    <span class="row" style="flex-wrap:nowrap"><a href="${url}" download="video-${stamp}.${ext}">Download</a>
    <button class="icon-btn" title="Delete">✕</button></span></div>`;
  el.querySelector('button').onclick = () => { URL.revokeObjectURL(url); el.remove(); };
  $('clips').prepend(el);
}
function toggleRecording() {
  if (recorder?.state === 'recording') { recorder.stop(); return; }
  if (!stream) return;
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    clearInterval(timer); $('rec').hidden = true;
    $('record').textContent = '⏺ Record'; $('record').classList.remove('stop'); $('power').disabled = false; $('camera').disabled = false; $('mic').disabled = false;
    if (chunks.length) addClip(new Blob(chunks, { type: recorder.mimeType || mime || 'video/webm' }), Date.now() - startedAt);
  };
  recorder.start(1000);
  startedAt = Date.now();
  $('rec').textContent = '00:00'; $('rec').hidden = false;
  timer = setInterval(() => $('rec').textContent = fmt(Date.now() - startedAt), 250);
  $('record').textContent = '⏹ Stop'; $('record').classList.add('stop');
  $('power').disabled = true; $('camera').disabled = true; $('mic').disabled = true;
}

$('power').onclick = () => (stream ? stop() : start());
$('record').onclick = toggleRecording;
$('camera').onchange = () => start($('camera').value);
$('mic').onchange = () => { if (stream) start($('camera').value || undefined); };
$('mirror').onchange = () => preview.classList.toggle('mirror', $('mirror').checked);
</script>
</body>
</html>
