<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checksum Address</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%85</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>✅ Checksum Address</h1>
  <p class="lead">Validate an address and convert it to its EIP-55 checksummed form. Mixed-case letters encode a checksum that catches typos.</p>

  <div class="panel">
    <div class="field">
      <label for="addr" class="muted">Address</label>
      <input id="addr" class="mono" spellcheck="false" autocomplete="off" placeholder="0x…" value="0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed">
    </div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="status" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { toChecksumAddress, strip0x } from '../lib/evm.js';
import { $, esc, renderRows, live } from '../lib/ui.js';

live([$('addr')], () => {
  const raw = $('addr').value.trim();
  const status = $('status');
  status.hidden = true;
  if (!raw) { $('out').innerHTML = ''; return; }
  const cs = toChecksumAddress(raw);
  const body = strip0x(raw), csBody = cs.slice(2);
  const lower = body === body.toLowerCase(), upper = body === body.toUpperCase();
  const wrong = [...body].map((c, i) => c !== csBody[i]);
  const nWrong = wrong.filter(Boolean).length;
  status.hidden = false;
  if (body === csBody) { status.className = 'status ok'; status.textContent = '✅ Valid checksum'; }
  else if (lower || upper) { status.className = 'status warn'; status.textContent = `⚠️ No checksum (all ${lower ? 'lowercase' : 'uppercase'}). The address is valid, but typos can't be detected. Use the checksummed form below.`; }
  else { status.className = 'status bad'; status.textContent = `❌ Invalid checksum: ${nWrong} letter${nWrong === 1 ? ' has' : 's have'} the wrong case. This may be a typo; double-check the address.`; }
  renderRows($('out'), [{ label: 'Checksummed', value: cs }, { label: 'Lowercase', value: cs.toLowerCase() }]);
  if (!lower && !upper && body !== csBody) {
    const marked = '0x' + [...body].map((c, i) => wrong[i] ? `<span class="mark">${esc(c)}</span>` : esc(c)).join('');
    $('out').insertAdjacentHTML('beforeend', `<div class="kv"><div class="k">Wrong case</div><div class="v">${marked}</div><span></span></div>`);
  }
}, { errEl: $('err'), outEl: $('out') });
</script>
</body>
</html>
