<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stake Address</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A5%A9</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Cardano</a>
  <h1>🥩 Stake Address</h1>
  <p class="lead">Get the stake (reward) address of a base address. All addresses of one wallet account share it; it's where staking rewards go.</p>
  <div class="panel">
    <label class="field"><span>Address</span>
      <input id="addr" class="mono" placeholder="addr1…" autocomplete="off" spellcheck="false"></label>
    <div class="row" style="margin-top:8px"><button type="button" id="example">Example</button></div>
    <p class="error" id="err" hidden></p>
    <div id="info" class="muted" style="margin-top:12px"></div>
    <div class="kv" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { parseAddress, stakeAddressOf, credBech32, NETWORKS } from '../lib/cardano.js';
import { $, row, esc, showError } from '../lib/ui.js';

function render() {
  const v = $('addr').value.trim();
  $('out').innerHTML = ''; $('info').textContent = '';
  if (!v) { showError($('err')); return; }
  let a;
  try { a = parseAddress(v); } catch (e) { showError($('err'), e); return; }
  showError($('err'));
  const net = NETWORKS[a.network] || `Network ${a.network}`;
  if (a.byron) { $('info').textContent = 'This is a Byron address. Byron addresses have no stake part, so they can\'t delegate.'; return; }
  if (a.type === 14 || a.type === 15) {
    $('info').textContent = 'This is already a stake address.';
    $('out').innerHTML = row('Stake address', a.bech32) + row('Stake credential (' + a.stake.type + ' hash)', a.stake.hex, credBech32(a.stake, 'stake'));
    return;
  }
  if (a.type === 6 || a.type === 7) { $('info').textContent = `${a.typeName}. Enterprise addresses have no stake part, so funds there can't be staked.`; return; }
  if (a.type === 4 || a.type === 5) {
    $('info').innerHTML = esc(`${a.typeName}. A pointer address refers to the stake registration certificate at slot ${a.pointer.slot}, transaction ${a.pointer.txIndex}, certificate ${a.pointer.certIndex}. Finding its stake key needs the chain, so it can't be worked out offline.`);
    return;
  }
  const s = stakeAddressOf(a);
  $('info').textContent = `${a.typeName} · ${net}`;
  $('out').innerHTML = [
    row('Stake address', s.bech32),
    row('Stake address (hex)', Array.from(s.bytes, b => b.toString(16).padStart(2, '0')).join('')),
    row('Stake credential (' + a.stake.type + ' hash)', a.stake.hex, credBech32(a.stake, 'stake')),
  ].join('');
}
$('addr').addEventListener('input', render);
$('example').onclick = () => { $('addr').value = 'addr1qx2fxv2umyhttkxyxp8x0dlpdt3k6cwng5pxj3jhsydzer3n0d3vllmyqwsx5wktcd8cc3sq835lu7drv2xwl2wywfgse35a3x'; render(); };
</script>
</body>
</html>
