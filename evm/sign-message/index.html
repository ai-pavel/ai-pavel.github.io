<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Message</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%8D%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/evm.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← EVM</a>
  <h1>✍️ Sign Message</h1>
  <p class="lead">Sign a message with a private key the way wallets do for <code>personal_sign</code> (EIP-191).</p>

  <div class="panel">
    <p class="warning">Runs locally in your browser. Don't paste keys that hold real funds.</p>
    <div class="field">
      <label for="key" class="muted">Private key</label>
      <input id="key" class="mono" spellcheck="false" autocomplete="off" placeholder="0x…">
    </div>
    <div class="row" style="margin-bottom:14px"><button id="random">Random key</button></div>
    <div class="field">
      <label for="msg" class="muted">Message</label>
      <textarea id="msg" rows="3" spellcheck="false">Hello, Ethereum!</textarea>
    </div>
    <label class="field inline-check"><input type="checkbox" id="is-hex"> Message is hex bytes</label>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { parsePrivateKey, addressFromPrivateKey, personalMessageHash, signHash, hexToBytes, bytesToHex, utf8, secp256k1 } from '../lib/evm.js';
import { $, esc, renderRows, live } from '../lib/ui.js';

const run = live([$('key'), $('msg'), $('is-hex')], () => {
  if (!$('key').value.trim()) { $('out').innerHTML = ''; return; }
  const key = parsePrivateKey($('key').value);
  const msg = $('is-hex').checked ? hexToBytes($('msg').value, 'Message') : utf8($('msg').value);
  const hash = personalMessageHash(msg);
  const sig = signHash(hash, key);
  const address = addressFromPrivateKey(key);
  const signature = bytesToHex(sig.bytes);
  renderRows($('out'), [
    { label: 'Signature', value: signature, cls: 'ok' },
    { label: 'Signer', value: address },
    { label: 'r', value: bytesToHex(sig.r) },
    { label: 's', value: bytesToHex(sig.s) },
    { label: 'v', value: String(sig.v) },
    { label: 'Message hash', value: bytesToHex(hash), note: 'keccak256("\\x19Ethereum Signed Message:\\n" + length + message)' },
  ]);
  const q = new URLSearchParams({ msg: $('msg').value, sig: signature, addr: address });
  if ($('is-hex').checked) q.set('hex', '1');
  $('out').insertAdjacentHTML('beforeend', `<p style="margin:10px 0 0"><a href="../verify-message/?${esc(q.toString())}">Verify this signature →</a></p>`);
}, { errEl: $('err'), outEl: $('out') });

$('random').onclick = () => { $('key').value = bytesToHex(secp256k1.utils.randomPrivateKey()); run(); };
</script>
</body>
</html>
