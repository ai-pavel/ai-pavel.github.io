<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%B0</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Cardano</a>
  <h1>💰 Unit Converter</h1>
  <p class="lead">Convert between lovelace and ADA. 1 ADA = 1,000,000 lovelace.</p>
  <div class="panel">
    <div class="row">
      <label class="field" style="flex:1 1 220px"><span>ADA</span><input id="ada" class="mono" inputmode="decimal" value="1.5" autocomplete="off"></label>
      <label class="field" style="flex:1 1 220px"><span>Lovelace</span><input id="lovelace" class="mono" inputmode="numeric" autocomplete="off"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" data-ada="1">1 ADA</button>
      <button type="button" data-ada="0.17">Typical fee</button>
      <button type="button" data-ada="2">Stake key deposit</button>
      <button type="button" data-ada="500">Pool deposit</button>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="kv" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { $, row, showError } from '../lib/ui.js';

const PER_ADA = 1000000n, MAX_SUPPLY = 45000000000n * PER_ADA;

function parseAda(s) {
  s = s.trim().replace(/[,_\s]/g, '');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) throw new Error('Enter an ADA amount, e.g. 1.5');
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);
  const [w, f = ''] = s.split('.');
  if (f.length > 6) throw new Error('ADA has 6 decimal places: the smallest amount is 0.000001 ADA (1 lovelace).');
  const v = BigInt(w || '0') * PER_ADA + BigInt((f + '000000').slice(0, 6));
  return neg ? -v : v;
}
function parseLovelace(s) {
  s = s.trim().replace(/[,_\s]/g, '');
  if (!/^-?\d+$/.test(s)) throw new Error('Lovelace is a whole number: no decimals.');
  return BigInt(s);
}
function adaString(v) {
  const neg = v < 0n, a = neg ? -v : v;
  const frac = (a % PER_ADA).toString().padStart(6, '0').replace(/0+$/, '');
  return (neg ? '-' : '') + (a / PER_ADA).toString() + (frac ? '.' + frac : '');
}
const group = s => s.replace(/^(-?)(\d+)/, (m, sign, d) => sign + d.replace(/\B(?=(\d{3})+(?!\d))/g, ','));

function show(v) {
  showError($('err'));
  $('out').innerHTML = [
    row('ADA', adaString(v)),
    row('Lovelace', v.toString(), group(v.toString()) + ' lovelace'),
  ].join('') + (v > MAX_SUPPLY ? '<p class="notice" style="margin-top:12px">That is more than the maximum ADA supply (45 billion).</p>' : '');
}
function fromAda() {
  try { const v = parseAda($('ada').value); $('lovelace').value = v.toString(); show(v); }
  catch (e) { showError($('err'), e); $('out').innerHTML = ''; }
}
function fromLovelace() {
  try { const v = parseLovelace($('lovelace').value); $('ada').value = adaString(v); show(v); }
  catch (e) { showError($('err'), e); $('out').innerHTML = ''; }
}
$('ada').addEventListener('input', fromAda);
$('lovelace').addEventListener('input', fromLovelace);
document.querySelectorAll('[data-ada]').forEach(b => b.onclick = () => { $('ada').value = b.dataset.ada; fromAda(); });
fromAda();
</script>
</body>
</html>
