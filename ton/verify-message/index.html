<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Message</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%94%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← TON</a>
  <h1>✔️ Verify Message</h1>

  <p class="lead">Check an ed25519 signature for a message and public key.</p>

  <div class="panel">
    <label class="field"><span>Public key (32 bytes, hex or base64)</span><input id="pub" class="mono" autocomplete="off" spellcheck="false"></label>
    <div class="row" style="margin-top:12px">
      <span class="muted">Message is</span>
      <div class="segmented" role="group" aria-label="Message format">
        <button type="button" data-fmt="text" aria-pressed="true">Text</button>
        <button type="button" data-fmt="hex" aria-pressed="false">Hex</button>
      </div>
    </div>
    <label class="field" style="margin-top:8px"><span>Message</span><textarea id="msg" rows="3" spellcheck="false"></textarea></label>
    <label class="field" style="margin-top:8px"><span>Signature (64 bytes, hex or base64)</span><textarea id="sig" rows="2" class="mono" spellcheck="false"></textarea></label>
    <div class="row" style="margin-top:12px"><button class="primary" type="button" id="go">Verify</button></div>
    <p class="error" id="err" hidden></p>
    <div id="out" style="margin-top:12px"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { ed25519, parseBytes, hexToBytes, utf8 } from '../lib/ton.js';
import { $, showError } from '../lib/ui.js';

let fmt = 'text';
document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-fmt]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  fmt = b.dataset.fmt;
});
$('go').onclick = () => {
  showError($('err')); $('out').innerHTML = '';
  try {
    const pub = parseBytes($('pub').value);
    if (pub.length !== 32) throw new Error(`Public key must be 32 bytes, got ${pub.length}`);
    const sig = parseBytes($('sig').value);
    if (sig.length !== 64) throw new Error(`Signature must be 64 bytes, got ${sig.length}`);
    const msg = fmt === 'hex' ? hexToBytes($('msg').value) : utf8($('msg').value);
    let ok = false;
    try { ok = ed25519.verify(sig, msg, pub); } catch { ok = false; }
    $('out').innerHTML = ok ? '<p class="ok">✓ Valid signature</p>' : '<p class="bad">✗ Invalid signature: the message, key or signature does not match</p>';
  } catch (e) { showError($('err'), e); }
};
</script>
</body>
</html>
