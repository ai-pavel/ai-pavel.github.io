<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TXID</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%86%94</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/btc.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Bitcoin</a>
  <h1>🆔 TXID</h1>
  <p class="lead">Compute a transaction's TXID and wTXID. The TXID hashes the transaction without witness data; the wTXID (BIP141) includes it. For non-segwit transactions they are equal.</p>

  <div class="panel">
    <div class="field"><span>Raw transaction (hex)</span><textarea id="tx" class="mono" rows="5" spellcheck="false"></textarea></div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.2 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { hexToBytes, parseTx } from '../lib/btc.js';
import { $, renderRows, live } from '../lib/ui.js';

const flip = h => h.match(/../g).reverse().join('');
live([$('tx')], () => {
  if (!$('tx').value.trim()) { $('out').innerHTML = ''; return; }
  const tx = parseTx(hexToBytes($('tx').value, 'Transaction'));
  const coinbase = tx.inputs.length === 1 && /^0{64}$/.test(tx.inputs[0].txid);
  renderRows($('out'), [
    { label: 'TXID', value: tx.txid, note: `HASH256 of ${tx.baseSize} bytes (no witness), reversed` },
    { label: 'wTXID', value: tx.wtxid, note: tx.segwit ? `HASH256 of all ${tx.size} bytes, reversed` : 'Same as the TXID: no witness data' },
    { label: 'TXID, internal order', value: flip(tx.txid), note: 'As written in outpoints of spending transactions' },
    { label: 'wTXID, internal order', value: flip(tx.wtxid) },
    { label: 'Segwit', value: tx.segwit ? 'Yes: signatures live in the witness, so they cannot change the TXID' : 'No', copy: false },
    coinbase && { label: 'Coinbase', value: 'In the block’s witness commitment, a coinbase wTXID counts as 32 zero bytes', copy: false },
    { label: 'Size / weight', value: `${tx.size} bytes, ${tx.weight} WU, ${tx.vsize} vbytes`, copy: false },
  ]);
}, { errEl: $('err'), outEl: $('out') });
</script>
</body>
</html>
