<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDA Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%AD</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/sol.css">
  <style>
    .seed { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; margin-top: 8px; }
    .seed input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
    .seed .bytes { grid-column: 1 / -1; font-size: 12px; color: var(--muted); word-break: break-all; margin-top: -2px; }
    .seed .bytes.bad { color: #c0392b; }
    @media (max-width: 480px) { .seed { grid-template-columns: 1fr auto; } .seed select { grid-column: 1 / -1; } }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Solana</a>
  <h1>🧭 PDA Finder</h1>
  <p class="lead">Find a program derived address (PDA) from a program ID and seeds, or check a specific bump.</p>

  <div class="panel">
    <label class="field">Program ID
      <input id="program" class="mono" autocomplete="off" spellcheck="false" placeholder="Program address (base58)">
    </label>
    <p class="section-title">Seeds</p>
    <div id="seeds"></div>
    <div class="row" style="margin-top:12px">
      <button id="add">+ Add seed</button>
      <button id="example">Example: associated token account</button>
    </div>
    <label class="field">Bump (optional: leave empty to search for the canonical bump)
      <input id="bump" type="number" min="0" max="255" placeholder="e.g. 254">
    </label>
    <p class="error" id="err" hidden></p>
    <div id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { decodePubkey, findProgramAddress, createProgramAddress, base58, hex, utf8, kvTable, wireCopy, showError, esc, ATA_PROGRAM, TOKEN_PROGRAM } from '../lib/sol.js';
const $ = id => document.getElementById(id);
const TYPES = {
  string: 'String (UTF-8)', pubkey: 'Public key', hex: 'Hex bytes',
  u8: 'u8', u16: 'u16 (LE)', u32: 'u32 (LE)', u64: 'u64 (LE)', i64: 'i64 (LE)', u128: 'u128 (LE)',
};
const INT = { u8: [1, false], u16: [2, false], u32: [4, false], u64: [8, false], i64: [8, true], u128: [16, false] };

function encodeSeed(type, value) {
  const v = value.trim();
  if (type === 'string') return utf8.encode(value);
  if (type === 'pubkey') return decodePubkey(v, 'Public key');
  if (type === 'hex') {
    const h = v.replace(/^0x/, '').replace(/\s+/g, '');
    if (h.length % 2 || !/^[0-9a-fA-F]*$/.test(h)) throw new Error('Hex must have an even number of 0-9, a-f characters.');
    return hex.decode(h.toLowerCase());
  }
  const [size, signed] = INT[type];
  if (!/^-?\d+$/.test(v)) throw new Error(`${type} must be an integer.`);
  let n = BigInt(v);
  const bits = BigInt(size * 8), min = signed ? -(1n << (bits - 1n)) : 0n, max = signed ? (1n << (bits - 1n)) - 1n : (1n << bits) - 1n;
  if (n < min || n > max) throw new Error(`${type} must be between ${min} and ${max}.`);
  if (n < 0n) n += 1n << bits;
  const out = new Uint8Array(size);
  for (let i = 0; i < size; i++) { out[i] = Number(n & 255n); n >>= 8n; }
  return out;
}

function addSeed(type = 'string', value = '') {
  const div = document.createElement('div');
  div.className = 'seed';
  div.innerHTML = `<select>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${k === type ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <input spellcheck="false" autocomplete="off" placeholder="Seed value"><button class="icon-btn" title="Remove">✕</button><div class="bytes"></div>`;
  div.querySelector('input').value = value;
  div.querySelector('button').onclick = () => { div.remove(); render(); };
  div.querySelector('select').onchange = render;
  div.querySelector('input').oninput = render;
  $('seeds').append(div);
}

function render() {
  $('out').innerHTML = '';
  let ok = true;
  const seeds = [...$('seeds').children].map((div, i) => {
    const b = div.querySelector('.bytes');
    try {
      const bytes = encodeSeed(div.querySelector('select').value, div.querySelector('input').value);
      b.className = bytes.length > 32 ? 'bytes bad' : 'bytes';
      b.textContent = `${bytes.length} bytes: ${hex.encode(bytes) || '(empty)'}` + (bytes.length > 32 ? ' · too long, max 32 bytes' : '');
      return bytes;
    } catch (e) { b.className = 'bytes bad'; b.textContent = e.message; ok = false; return null; }
  });
  const prog = $('program').value.trim();
  if (!prog) { showError($('err')); return; }
  if (!ok) { showError($('err'), 'Fix the seeds marked in red.'); return; }
  try {
    const pid = decodePubkey(prog, 'Program ID');
    const bumpStr = $('bump').value.trim();
    if (bumpStr !== '') {
      const bump = Number(bumpStr);
      if (!Number.isInteger(bump) || bump < 0 || bump > 255) throw new Error('Bump must be 0–255.');
      const addr = createProgramAddress([...seeds, Uint8Array.of(bump)], pid);
      const canon = findProgramAddress(seeds, pid);
      $('out').innerHTML = kvTable([['Address', base58.encode(addr)], ['Bump', String(bump), bump === canon.bump ? 'This is the canonical bump.' : `Not canonical: findProgramAddress returns bump ${canon.bump}.`]]);
    } else {
      const r = findProgramAddress(seeds, pid);
      $('out').innerHTML = kvTable([['Address', base58.encode(r.address)], ['Canonical bump', String(r.bump)], ['Address (hex)', hex.encode(r.address)]]);
    }
    showError($('err'));
  } catch (e) { showError($('err'), e.message); }
}

$('program').oninput = render;
$('bump').oninput = render;
$('add').onclick = () => { addSeed(); render(); };
$('example').onclick = () => {
  $('program').value = ATA_PROGRAM; $('seeds').innerHTML = ''; $('bump').value = '';
  addSeed('pubkey', '9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM');
  addSeed('pubkey', TOKEN_PROGRAM);
  addSeed('pubkey', 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v');
  render();
};
addSeed();
wireCopy();
</script>
</body>
</html>
