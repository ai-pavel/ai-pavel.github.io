<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HASH160</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%97</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/btc.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Bitcoin</a>
  <h1>🔗 HASH160</h1>
  <p class="lead">Hash bytes with SHA-256 and then RIPEMD-160 (HASH160). Bitcoin uses it for public key hashes and script hashes in addresses.</p>

  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="hex" aria-pressed="true">Hex bytes</button>
      <button data-mode="text" aria-pressed="false">Text (UTF-8)</button>
    </div>
    <div class="field">
      <textarea id="input" class="mono" rows="3" spellcheck="false" placeholder="e.g. a compressed public key 02… or a redeem script"></textarea>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.2 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { sha256, hash160, bytesToHex, readInput, base58check, concat, encodeSegwit, NETWORKS, secp256k1 } from '../lib/btc.js';
import { $, renderRows, live, segmented } from '../lib/ui.js';

let run;
const mode = segmented($('mode'), () => run());
run = live([$('input')], () => {
  if (!$('input').value.trim() && mode() === 'hex') { $('out').innerHTML = ''; return; }
  const bytes = readInput($('input').value, mode());
  const h = hash160(bytes), net = NETWORKS.mainnet;
  let isKey = false;
  if (mode() === 'hex' && (bytes.length === 33 || bytes.length === 65)) {
    try { secp256k1.ProjectivePoint.fromHex(bytes); isKey = true; } catch {}
  }
  renderRows($('out'), [
    { label: 'Step 1: SHA-256', value: bytesToHex(sha256(bytes)) },
    { label: 'Step 2: RIPEMD-160 = HASH160', value: bytesToHex(h), note: 'RIPEMD-160 of the step 1 digest' },
    isKey && { label: 'As P2PKH address', value: base58check.encode(concat(Uint8Array.of(net.pkh), h)), note: 'The input is a public key' },
    isKey && bytes.length === 33 && { label: 'As P2WPKH address', value: encodeSegwit(net.hrp, 0, h) },
    !isKey && mode() === 'hex' && bytes.length && { label: 'As P2SH address', value: base58check.encode(concat(Uint8Array.of(net.sh), h)), note: 'If the input is a redeem script' },
    { label: 'Input size', value: `${bytes.length} bytes`, copy: false },
  ]);
}, { errEl: $('err'), outEl: $('out') });
</script>
</body>
</html>
