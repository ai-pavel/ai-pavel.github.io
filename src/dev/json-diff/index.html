<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Diff</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%86%9A</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    td.add { color: var(--ok); } td.rem { color: var(--bad); } td.chg { color: var(--warn); }
    .error { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🆚 JSON Diff</h1>
  <p class="lead">Compare two JSON documents.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="grid2">
      <div class="field"><span>Original JSON</span><textarea id="a" class="mono" rows="10" spellcheck="false">{"name":"Alice","age":30,"roles":["admin","dev"],"address":{"city":"Lisbon"},"active":true}</textarea></div>
      <div class="field"><span>Changed JSON</span><textarea id="b" class="mono" rows="10" spellcheck="false">{"name":"Alice","age":31,"roles":["dev","admin","ops"],"address":{"city":"Porto","zip":"4000"}}</textarea></div>
    </div>
    <div class="toolbar"><label><input type="checkbox" id="unordered"> Ignore array order</label></div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="stats"></p>
    <div class="scroll"><table class="data" id="out"></table></div>
  </div>
  <script type="module">
import { $, live, esc } from '../lib/ui.js';
import { parseJson, sortKeys } from '../lib/json.js';

const typeOf = v => v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v;
const canon = v => JSON.stringify(sortKeys(v));
const keyPath = (p, k) => /^[A-Za-z_$][\w$]*$/.test(k) ? `${p}.${k}` : `${p}[${JSON.stringify(k)}]`;
function compare(a, b, path, out, unordered) {
  const ta = typeOf(a), tb = typeOf(b);
  if (ta !== tb) { out.push({ kind: 'changed', path, from: a, to: b }); return; }
  if (ta === 'object') {
    for (const k of Object.keys(a)) if (!(k in b)) out.push({ kind: 'removed', path: keyPath(path, k), from: a[k] });
    for (const k of Object.keys(b)) {
      if (!(k in a)) out.push({ kind: 'added', path: keyPath(path, k), to: b[k] });
      else compare(a[k], b[k], keyPath(path, k), out, unordered);
    }
  } else if (ta === 'array') {
    if (unordered) {
      const left = a.map(canon), right = b.map(canon);
      const pool = new Map();
      right.forEach((c, i) => pool.set(c, [...(pool.get(c) || []), i]));
      a.forEach((x, i) => { const hits = pool.get(left[i]); if (hits && hits.length) hits.shift(); else out.push({ kind: 'removed', path: `${path}[${i}]`, from: x }); });
      for (const [c, idx] of pool) for (const i of idx) out.push({ kind: 'added', path: `${path}[${i}]`, to: b[i] });
    } else {
      const n = Math.max(a.length, b.length);
      for (let i = 0; i < n; i++) {
        if (i >= a.length) out.push({ kind: 'added', path: `${path}[${i}]`, to: b[i] });
        else if (i >= b.length) out.push({ kind: 'removed', path: `${path}[${i}]`, from: a[i] });
        else compare(a[i], b[i], `${path}[${i}]`, out, unordered);
      }
    }
  } else if (a !== b) out.push({ kind: 'changed', path, from: a, to: b });
}
const show = v => v === undefined ? '' : esc(JSON.stringify(v));
live([$('a'), $('b'), $('unordered')], () => {
  $('out').innerHTML = ''; $('stats').textContent = '';
  const a = parseJson($('a').value, 'original JSON'), b = parseJson($('b').value, 'changed JSON');
  const out = [];
  compare(a, b, '$', out, $('unordered').checked);
  const count = k => out.filter(d => d.kind === k).length;
  $('stats').className = 'status ' + (out.length ? '' : 'ok');
  $('stats').textContent = out.length ? `${out.length} difference${out.length === 1 ? '' : 's'}: ${count('added')} added, ${count('removed')} removed, ${count('changed')} changed` : 'The documents are equal.';
  if (out.length) $('out').innerHTML = '<tr><th>Change</th><th>Path</th><th>Before</th><th>After</th></tr>' + out.map(d =>
    `<tr><td class="${d.kind === 'added' ? 'add' : d.kind === 'removed' ? 'rem' : 'chg'}">${d.kind}</td><td class="mono">${esc(d.path)}</td><td class="mono">${show(d.from)}</td><td class="mono">${show(d.to)}</td></tr>`).join('');
}, { errEl: $('err') });
  </script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.3 MB</span></span>

</footer>
</body>
</html>
