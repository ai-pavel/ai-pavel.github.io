<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign &amp; Verify</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%8D%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/sol.css">
  <style>
    .verdict { margin-top: 16px; font-size: 18px; }
  
    .mode-tabs { display: inline-flex; gap: 0; margin: 18px 0 4px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .mode-tabs button { border: 0; border-radius: 0; padding: 8px 18px; background: var(--surface); }
    .mode-tabs button + button { border-left: 1px solid var(--border); }
    .mode-tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
    [hidden] { display: none !important; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Solana</a>
  <h1>✍️ Sign &amp; Verify</h1>
  <p class="lead">Sign a message with an ed25519 key, the way wallets do for <code>signMessage</code>, or verify a message signature.</p>
  <div class="mode-tabs" role="tablist"><button type="button" role="tab" data-tab="sign">Sign</button><button type="button" role="tab" data-tab="verify">Verify</button></div>
  <section id="tab-sign" class="mode-panel" data-tab-panel="sign">

  <div class="panel">
    <label class="field">Secret key: base58, JSON byte array or hex (32-byte seed or 64-byte keypair)
      <textarea id="s-secret" class="wide" rows="3" spellcheck="false" autocomplete="off"></textarea>
    </label>
    <div class="row" style="margin-top:8px"><button id="s-gen">Generate a test key</button></div>
    <label class="field">Message
      <textarea id="s-msg" class="wide" rows="4" spellcheck="false">Hello, Solana!</textarea>
    </label>
    <label class="field">Message encoding
      <select id="s-enc"><option value="utf8">Text (UTF-8)</option><option value="hex">Hex</option><option value="base58">Base58</option><option value="base64">Base64</option></select>
    </label>
    <p class="error" id="s-err" hidden></p>
    <div id="s-out"></div>
    <p class="note">Runs locally in your browser. Don't paste keys that hold real funds.</p>
  </div>
  </section>
  <section id="tab-verify" class="mode-panel" data-tab-panel="verify">

  <div class="panel">
    <label class="field">Public key (address)
      <input id="v-pub" class="mono" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">Message
      <textarea id="v-msg" class="wide" rows="4" spellcheck="false"></textarea>
    </label>
    <label class="field">Message encoding
      <select id="v-enc"><option value="utf8">Text (UTF-8)</option><option value="hex">Hex</option><option value="base58">Base58</option><option value="base64">Base64</option></select>
    </label>
    <label class="field">Signature (base58, hex or base64)
      <textarea id="v-sig" class="wide" rows="2" spellcheck="false" autocomplete="off"></textarea>
    </label>
    <p class="error" id="v-err" hidden></p>
    <div id="v-out"></div>
  </div>
  </section>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.2 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script>
// Tabs: ?mode=<tab> selects one; switching keeps the rest of the URL.
(() => {
  const tabs = [...document.querySelectorAll('.mode-tabs [data-tab]')];
  const show = (mode, push) => {
    if (!tabs.some(t => t.dataset.tab === mode)) mode = tabs[0].dataset.tab;
    for (const t of tabs) {
      const on = t.dataset.tab === mode;
      t.setAttribute('aria-selected', String(on));
      document.getElementById('tab-' + t.dataset.tab).hidden = !on;
    }
    if (push) {
      const u = new URL(location.href);
      u.searchParams.set('mode', mode);
      history.replaceState(null, '', u);
    }
    document.dispatchEvent(new CustomEvent('tabchange', { detail: mode }));
  };
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.tab, true)));
  show(new URLSearchParams(location.search).get('mode'), false);
})();
</script>
<script type="module">
import { ed25519, parseSecret, parseBytes, keypairFromSeed, base58, base64, hex, kvTable, wireCopy, showError } from '../lib/sol.js';
const $ = id => document.getElementById('s-' + id);
const __sec = document.getElementById('tab-sign');

function render() {
  $('out').innerHTML = '';
  if (!$('secret').value.trim()) return showError($('err'));
  try {
    const kp = parseSecret($('secret').value);
    const msg = parseBytes($('msg').value, $('enc').value);
    const sig = ed25519.sign(msg, kp.seed);
    showError($('err'), kp.mismatch ? 'Warning: the public-key half of this 64-byte key does not match its seed. Signing uses the seed.' : '');
    $('out').innerHTML = kvTable([
      ['Public key', base58.encode(kp.publicKey)],
      ['Signature (base58)', base58.encode(sig)],
      ['Signature (hex)', hex.encode(sig)],
      ['Signature (base64)', base64.encode(sig)],
      ['Message bytes', `${msg.length} bytes`],
    ]);
  } catch (e) { showError($('err'), e.message); }
}
['secret', 'msg'].forEach(id => $(id).oninput = render);
$('enc').onchange = render;
$('gen').onclick = () => { $('secret').value = base58.encode(keypairFromSeed(crypto.getRandomValues(new Uint8Array(32))).secretKey); render(); };
wireCopy();
</script>
<script type="module">
import { ed25519, decodePubkey, parseBytes, base58, base64, hex, showError } from '../lib/sol.js';
const $ = id => document.getElementById('v-' + id);
const __sec = document.getElementById('tab-verify');

function parseSig(s) {
  const t = s.trim().replace(/\s+/g, '');
  const tries = [
    () => /^(0x)?[0-9a-fA-F]{128}$/.test(t) ? hex.decode(t.replace(/^0x/, '').toLowerCase()) : null,
    () => base58.decode(t),
    () => base64.decode(t),
  ];
  for (const f of tries) { try { const b = f(); if (b && b.length === 64) return b; } catch {} }
  throw new Error('Signature must be 64 bytes, as base58, hex or base64.');
}
function render() {
  $('out').innerHTML = '';
  if (!$('pub').value.trim() || !$('sig').value.trim()) return showError($('err'));
  try {
    const pub = decodePubkey($('pub').value, 'Public key');
    const msg = parseBytes($('msg').value, $('enc').value);
    const sig = parseSig($('sig').value);
    let ok = false;
    try { ok = ed25519.verify(sig, msg, pub); } catch { ok = false; }
    showError($('err'));
    $('out').innerHTML = ok
      ? '<p class="verdict ok">✅ Valid: this address signed this message.</p>'
      : '<p class="verdict bad">❌ Invalid: the signature does not match this address and message.</p><p class="muted">Check the message encoding and that the message is byte-for-byte identical, including spaces and line breaks.</p>';
  } catch (e) { showError($('err'), e.message); }
}
['pub', 'msg', 'sig'].forEach(id => $(id).oninput = render);
$('enc').onchange = render;
</script>
</body>
</html>
