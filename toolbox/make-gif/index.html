<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make GIF</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%9E%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; width: fit-content; max-width: 100%; }
    .tabs button { border: 0; background: transparent; }
    .tabs button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      margin-top: 16px; padding: 28px 16px; border: 2px dashed var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; color: var(--muted);
    }
    .drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }
    .drop strong { color: var(--text); }
    .drop input { display: none; }
    .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 16px; }
    .settings input, .settings select { width: 100%; }
    video, .result img { display: block; max-width: 100%; max-height: 360px; margin: 16px auto 0; border-radius: 8px; background: #000; }
    .result img { background: repeating-conic-gradient(var(--border) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
    .frame .thumb { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
    .frame img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .frame .info { flex: 1; min-width: 0; }
    .frame .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .frame input { width: 84px; }
    .frame .row { gap: 4px; }
    progress { width: 100%; height: 10px; margin-top: 16px; accent-color: var(--accent); }
    a.btn { padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Utilities</a>
  <h1>🎞️ Make GIF</h1>
  <p class="lead">Turn a video clip or a set of images into an animated GIF, right in your browser.</p>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="video">From video</button>
      <button role="tab" aria-selected="false" data-tab="images">From images</button>
    </div>

    <section id="tab-video">
      <label class="drop" data-drop="video">
        <input type="file" id="videoFile" accept="video/*">
        <span style="font-size:32px">🎬</span>
        <strong>Drop a video here or click to choose</strong>
        <span>MP4, WebM or MOV that your browser can play</span>
      </label>
      <div id="videoOpts" hidden>
        <video id="video" controls muted playsinline></video>
        <div class="settings">
          <label>Start (s) <input id="start" type="number" min="0" step="0.1" value="0"></label>
          <label>End (s) <input id="end" type="number" min="0" step="0.1" value="3"></label>
          <label>Frames per second <select id="fps"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option></select></label>
          <label>Width (px) <input id="vwidth" type="number" min="16" max="1920" value="480"></label>
        </div>
        <div class="row" style="margin-top:12px">
          <button id="useCurrentStart">Start = current frame</button>
          <button id="useCurrentEnd">End = current frame</button>
        </div>
        <p class="muted" id="videoHint"></p>
      </div>
    </section>

    <section id="tab-images" hidden>
      <label class="drop" data-drop="images">
        <input type="file" id="imageFiles" accept="image/*" multiple>
        <span style="font-size:32px">🖼️</span>
        <strong>Drop images here or click to choose</strong>
        <span>Each image becomes one frame. Reorder with the arrows.</span>
      </label>
      <div id="imageOpts" hidden>
        <div class="settings">
          <label>Width (px) <input id="iwidth" type="number" min="16" max="1920" value="480"></label>
          <label>Delay for all (ms) <input id="allDelay" type="number" min="20" step="10" value="500"></label>
          <label>Background <input id="bg" type="color" value="#ffffff" style="height:40px;padding:4px"></label>
        </div>
        <div class="list" id="frames"></div>
      </div>
    </section>

    <div class="row" style="margin-top:20px">
      <label style="flex-direction:row;align-items:center;gap:8px;color:inherit"><input type="checkbox" id="loop" checked> Loop forever</label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="make" disabled>Make GIF</button>
      <button id="cancel" hidden>Cancel</button>
      <span class="muted" id="status"></span>
    </div>
    <progress id="progress" max="1" value="0" hidden></progress>

    <div class="result" id="result" hidden>
      <img id="gif" alt="Generated GIF">
      <div class="row" style="justify-content:center;margin-top:12px">
        <a class="btn" id="download" download="animation.gif">Download GIF</a>
        <span class="muted" id="resultInfo"></span>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtBytes = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const MAX_FRAMES = 300;

// Encoding runs in a worker so the page stays responsive. The worker is a blob, so it
// needs an absolute URL for its import.
const GIFENC_URL = new URL('../../assets/vendor/gifenc@1.0.3/dist/gifenc.esm.js', location.href).href;
const WORKER_SRC = `
import { GIFEncoder, quantize, applyPalette } from '${GIFENC_URL}';
let gif;
onmessage = ({ data }) => {
  if (data.type === 'start') { gif = GIFEncoder(); return; }
  if (data.type === 'frame') {
    const rgba = new Uint8ClampedArray(data.buffer);
    const palette = quantize(rgba, 256);
    const index = applyPalette(rgba, palette);
    gif.writeFrame(index, data.width, data.height, { palette, delay: data.delay, repeat: data.repeat });
    postMessage({ type: 'progress', i: data.i });
    return;
  }
  if (data.type === 'finish') {
    gif.finish();
    const bytes = gif.bytes();
    postMessage({ type: 'done', bytes }, [bytes.buffer]);
  }
};`;
const workerURL = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));

let tab = 'video', frames = [], nextId = 1, job = null, resultURL = null, videoURL = null;

// ---------- tabs ----------
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('tab-video').hidden = tab !== 'video'; $('tab-images').hidden = tab !== 'images';
  updateMake();
});

// ---------- drop zones ----------
document.querySelectorAll('[data-drop]').forEach(zone => {
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => {
    e.preventDefault(); zone.classList.remove('over');
    const files = [...e.dataTransfer.files];
    zone.dataset.drop === 'video' ? loadVideo(files[0]) : addImages(files);
  };
});
$('videoFile').onchange = e => { loadVideo(e.target.files[0]); e.target.value = ''; };
$('imageFiles').onchange = e => { addImages([...e.target.files]); e.target.value = ''; };

// ---------- video ----------
const video = $('video');
function loadVideo(file) {
  if (!file) return;
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(file);
  video.src = videoURL;
  video.onloadedmetadata = () => {
    $('videoOpts').hidden = false;
    $('start').value = 0;
    $('end').value = Math.min(video.duration, 3).toFixed(1);
    $('start').max = $('end').max = video.duration.toFixed(1);
    $('vwidth').value = Math.min(video.videoWidth, 480);
    videoHint(); updateMake();
  };
  video.onerror = () => alert("This video can't be played by your browser. Try converting it to MP4 first.");
}
function videoRange() {
  const start = Math.max(0, +$('start').value || 0), end = Math.min(video.duration || 0, +$('end').value || 0);
  const fps = +$('fps').value;
  return { start, end, fps, count: Math.max(0, Math.floor((end - start) * fps)) };
}
function videoHint() {
  const { count } = videoRange();
  $('videoHint').textContent = count > MAX_FRAMES
    ? `That's ${count} frames — the limit is ${MAX_FRAMES}. Shorten the clip or lower the frame rate.`
    : `${count} frames. Longer clips and larger widths make bigger files.`;
}
['start', 'end', 'fps', 'vwidth'].forEach(id => $(id).addEventListener('input', () => { videoHint(); updateMake(); }));
$('useCurrentStart').onclick = () => { $('start').value = video.currentTime.toFixed(1); videoHint(); updateMake(); };
$('useCurrentEnd').onclick = () => { $('end').value = video.currentTime.toFixed(1); videoHint(); updateMake(); };

const seek = t => new Promise((resolve, reject) => {
  const done = () => { video.removeEventListener('seeked', done); resolve(); };
  video.addEventListener('seeked', done);
  video.currentTime = t;
  setTimeout(() => reject(new Error('Seeking timed out')), 10000);
});

async function* videoFrames(signal) {
  const { start, fps, count } = videoRange();
  const width = Math.min(+$('vwidth').value || 480, 1920);
  const height = Math.max(1, Math.round(width * video.videoHeight / video.videoWidth));
  const c = new OffscreenCanvas(width, height), ctx = c.getContext('2d', { willReadFrequently: true });
  video.pause();
  for (let i = 0; i < count; i++) {
    if (signal.aborted) return;
    await seek(start + i / fps + 0.0001);
    ctx.drawImage(video, 0, 0, width, height);
    yield { width, height, rgba: ctx.getImageData(0, 0, width, height).data, delay: 1000 / fps, total: count };
  }
}

// ---------- images ----------
async function addImages(files) {
  for (const file of files) {
    try {
      const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      frames.push({ id: nextId++, name: file.name, bitmap, url: URL.createObjectURL(file), delay: +$('allDelay').value || 500 });
    } catch { alert(`"${file.name}" couldn't be opened as an image.`); }
  }
  if (frames.length) $('imageOpts').hidden = false;
  if (frames.length && !$('iwidth').dataset.touched) $('iwidth').value = Math.min(frames[0].bitmap.width, 480);
  renderFrames(); updateMake();
}
function renderFrames() {
  $('frames').innerHTML = frames.map((f, i) => `
    <div class="item frame stack" data-id="${f.id}">
      <div class="thumb">
        <img src="${f.url}" alt="">
        <div class="info">
          <div class="name" title="${esc(f.name)}">${i + 1}. ${esc(f.name)}</div>
          <div class="muted">${f.bitmap.width}×${f.bitmap.height}</div>
        </div>
      </div>
      <div class="row">
        <input type="number" min="20" step="10" value="${f.delay}" data-delay="${f.id}" title="Delay (ms)" aria-label="Delay in milliseconds">
        <button class="icon-btn" data-move="-1" ${i === 0 ? 'disabled' : ''} title="Move up">↑</button>
        <button class="icon-btn" data-move="1" ${i === frames.length - 1 ? 'disabled' : ''} title="Move down">↓</button>
        <button class="icon-btn" data-remove title="Remove">✕</button>
      </div>
    </div>`).join('');
}
$('frames').onclick = e => {
  const row = e.target.closest('[data-id]'); if (!row) return;
  const i = frames.findIndex(f => f.id === +row.dataset.id);
  if (e.target.dataset.move) {
    const j = i + +e.target.dataset.move;
    [frames[i], frames[j]] = [frames[j], frames[i]];
  } else if (e.target.hasAttribute('data-remove')) {
    URL.revokeObjectURL(frames[i].url); frames[i].bitmap.close(); frames.splice(i, 1);
  } else return;
  renderFrames(); updateMake();
};
$('frames').oninput = e => {
  const id = +e.target.dataset.delay;
  if (id) frames.find(f => f.id === id).delay = Math.max(20, +e.target.value || 20);
};
$('allDelay').oninput = () => { const d = Math.max(20, +$('allDelay').value || 20); frames.forEach(f => f.delay = d); renderFrames(); };
$('iwidth').oninput = () => { $('iwidth').dataset.touched = 1; };

async function* imageFrames(signal) {
  const width = Math.min(+$('iwidth').value || 480, 1920);
  const first = frames[0].bitmap, height = Math.max(1, Math.round(width * first.height / first.width));
  const c = new OffscreenCanvas(width, height), ctx = c.getContext('2d', { willReadFrequently: true });
  for (const f of frames) {
    if (signal.aborted) return;
    ctx.fillStyle = $('bg').value; ctx.fillRect(0, 0, width, height);
    const s = Math.min(width / f.bitmap.width, height / f.bitmap.height); // contain, centered
    const w = f.bitmap.width * s, h = f.bitmap.height * s;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(f.bitmap, (width - w) / 2, (height - h) / 2, w, h);
    yield { width, height, rgba: ctx.getImageData(0, 0, width, height).data, delay: f.delay, total: frames.length };
  }
}

// ---------- encode ----------
function updateMake() {
  const ready = tab === 'video'
    ? !$('videoOpts').hidden && videoRange().count >= 1 && videoRange().count <= MAX_FRAMES
    : frames.length >= 1;
  $('make').disabled = !ready || !!job;
}

$('make').onclick = async () => {
  const abort = new AbortController(), worker = new Worker(workerURL, { type: 'module' });
  job = { abort, worker };
  $('make').disabled = true; $('cancel').hidden = false; $('progress').hidden = false; $('progress').value = 0;
  $('status').textContent = 'Reading frames…';
  let total = 1, encoded = 0, sent = 0, width = 0, height = 0;
  const finished = new Promise((resolve, reject) => {
    job.reject = reject;
    worker.onerror = e => reject(new Error(e.message || 'The GIF encoder failed to start'));
    worker.onmessage = ({ data }) => {
      if (data.type === 'progress') { encoded = data.i + 1; $('progress').value = (sent + encoded) / (2 * total); }
      if (data.type === 'done') resolve(data.bytes);
    };
  });
  finished.catch(() => {}); // a cancel before encoding finishes must not surface as an unhandled rejection
  try {
    worker.postMessage({ type: 'start' });
    const repeat = $('loop').checked ? 0 : -1;
    const source = tab === 'video' ? videoFrames(abort.signal) : imageFrames(abort.signal);
    for await (const f of source) {
      total = f.total; width = f.width; height = f.height;
      worker.postMessage({ type: 'frame', i: sent, width: f.width, height: f.height, delay: Math.round(f.delay), repeat, buffer: f.rgba.buffer }, [f.rgba.buffer]);
      sent++;
      $('status').textContent = `Frame ${sent} of ${total}…`;
      $('progress').value = (sent + encoded) / (2 * total);
    }
    if (abort.signal.aborted) return;
    $('status').textContent = 'Encoding…';
    worker.postMessage({ type: 'finish' });
    const bytes = await finished;
    if (resultURL) URL.revokeObjectURL(resultURL);
    const blob = new Blob([bytes], { type: 'image/gif' });
    resultURL = URL.createObjectURL(blob);
    $('gif').src = resultURL; $('download').href = resultURL;
    $('resultInfo').textContent = `${width}×${height} · ${sent} frames · ${fmtBytes(blob.size)}`;
    $('result').hidden = false; $('status').textContent = 'Done.';
  } catch (err) {
    if (!abort.signal.aborted) $('status').textContent = 'Failed: ' + err.message;
  } finally {
    worker.terminate(); job = null;
    if (abort.signal.aborted) $('status').textContent = 'Cancelled.';
    $('cancel').hidden = true; $('progress').hidden = true; updateMake();
  }
};
$('cancel').onclick = () => {
  if (!job) return;
  job.abort.abort(); job.worker.terminate(); job.reject(new Error('Cancelled'));
};
</script>
</body>
</html>
