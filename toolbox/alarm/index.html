<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⏰ Alarm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8F%B0</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .ringing { text-align: center; border-color: var(--accent); }
    .ringing .display { margin-bottom: 8px; }
    .ringing .row { justify-content: center; }
    .item.off { opacity: 0.55; }
    .switch { flex-direction: row; align-items: center; gap: 6px; }
  </style>
</head>
<body>
<main>
  <a class="back" href="../">← All tools</a>
  <h1>⏰ Alarm</h1>
  <p class="lead">Set alarms that ring in this tab. Keep the tab open; your alarms are saved in this browser.</p>

  <div class="panel ringing" id="ringing" hidden>
    <div class="display" id="ringTime"></div>
    <p class="big" id="ringLabel"></p>
    <div class="row">
      <button id="snooze">Snooze 5 min</button>
      <button class="primary" id="dismiss">Dismiss</button>
    </div>
  </div>

  <div class="panel">
    <div class="display" id="clock">--:--:--</div>
    <form class="row" id="add">
      <label>Time <input id="time" type="time" required></label>
      <label style="flex:1;min-width:140px">Label <input id="label" placeholder="e.g. Stand-up" maxlength="60"></label>
      <label class="switch"><input id="daily" type="checkbox"> Repeat daily</label>
      <button class="primary" style="align-self:flex-end">Add alarm</button>
    </form>
    <div class="list" id="list"></div>
    <p class="muted" id="empty">No alarms yet.</p>
  </div>
</main>
<script>
const KEY = 'toolbox.alarms';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const MISSED_GRACE = 10 * 60 * 1000; // ring alarms missed by less than this when the page reopens

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(alarms)); } catch {} }
let alarms = load(), ringingId = null, audio = null, beepLoop = null;

// Next timestamp (ms) at which HH:MM occurs strictly after `after`.
function nextAt(time, after = Date.now()) {
  const [h, m] = time.split(':').map(Number), d = new Date(after);
  d.setHours(h, m, 0, 0);
  if (d.getTime() <= after) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function untilLabel(ms) {
  const mins = Math.max(0, Math.ceil(ms / 60000)), h = Math.floor(mins / 60), m = mins % 60;
  return 'in ' + (h ? `${h}h ${m}m` : `${m}m`);
}

// Sound: browsers only allow audio after a user gesture, so unlock on first interaction.
function unlockAudio() {
  try { audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume(); } catch {}
}
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);
function beep() {
  if (!audio) return;
  try {
    [0, 0.25, 0.5].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 960; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.3, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.2);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });
  } catch {}
}

function ring(a) {
  ringingId = a.id;
  $('ringTime').textContent = a.time;
  $('ringLabel').textContent = a.label || 'Alarm';
  $('ringing').hidden = false;
  document.title = '⏰ ' + (a.label || 'Alarm') + '!';
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('⏰ Alarm', { body: `${a.time}${a.label ? ' · ' + a.label : ''}`, requireInteraction: true }); } catch {}
  }
  beep(); clearInterval(beepLoop); beepLoop = setInterval(beep, 1500);
}
function stopRinging() {
  clearInterval(beepLoop); beepLoop = null; ringingId = null;
  $('ringing').hidden = true; document.title = '⏰ Alarm';
}

$('dismiss').onclick = () => {
  const a = alarms.find(x => x.id === ringingId);
  if (a) { if (a.daily) a.next = nextAt(a.time); else a.enabled = false; save(); }
  stopRinging(); render();
};
$('snooze').onclick = () => {
  const a = alarms.find(x => x.id === ringingId);
  if (a) { a.next = Date.now() + 5 * 60 * 1000; a.snoozed = true; save(); }
  stopRinging(); render();
};

function check() {
  const now = Date.now();
  $('clock').textContent = new Date(now).toLocaleTimeString('en-GB');
  if (ringingId) return;
  const due = alarms.find(a => a.enabled && a.next <= now);
  if (due) { due.snoozed = false; save(); ring(due); render(); }
}

function render() {
  const now = Date.now();
  alarms.sort((a, b) => a.time.localeCompare(b.time));
  $('empty').hidden = alarms.length > 0;
  $('list').innerHTML = alarms.map(a => `
    <div class="item${a.enabled ? '' : ' off'}">
      <div>
        <div class="big mono">${esc(a.time)}</div>
        <div class="muted">${a.label ? esc(a.label) + ' · ' : ''}${a.daily ? 'Daily' : 'Once'}${a.enabled ? ' · ' + (a.snoozed ? 'snoozed, ' : '') + untilLabel(a.next - now) : ''}</div>
      </div>
      <div class="row">
        <label class="switch" title="On/off"><input type="checkbox" data-toggle="${a.id}" ${a.enabled ? 'checked' : ''}> On</label>
        <button class="icon-btn" data-remove="${a.id}" title="Remove">✕</button>
      </div>
    </div>`).join('');
}

$('list').onclick = e => {
  const id = e.target.dataset.remove;
  if (id) { if (id === ringingId) stopRinging(); alarms = alarms.filter(a => a.id !== id); save(); render(); }
};
$('list').onchange = e => {
  const a = alarms.find(x => x.id === e.target.dataset.toggle);
  if (!a) return;
  a.enabled = e.target.checked; a.snoozed = false;
  if (a.enabled) a.next = nextAt(a.time);
  save(); render();
};
$('add').onsubmit = e => {
  e.preventDefault();
  const time = $('time').value;
  if (!/^\d\d:\d\d$/.test(time)) return;
  alarms.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), time, label: $('label').value.trim(),
    daily: $('daily').checked, enabled: true, next: nextAt(time) });
  save(); $('label').value = ''; render();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
};

// On load: ring recently missed alarms, reschedule or switch off older ones.
(function catchUp() {
  const now = Date.now();
  alarms.forEach(a => {
    if (!a.enabled || a.next > now - MISSED_GRACE) return;
    if (a.daily) a.next = nextAt(a.time, now); else a.enabled = false;
  });
  save();
})();
const d = new Date(Date.now() + 60000);
$('time').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
render(); check();
setInterval(check, 1000);
setInterval(render, 30000);
</script>
</body>
</html>
