<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schnorr Verify</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%9B%A1%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/btc.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Bitcoin</a>
  <h1>🛡️ Schnorr Verify</h1>
  <p class="lead">Verify a BIP340 Schnorr signature for an x-only public key and a message.</p>

  <div class="panel">
    <div class="field"><span>Public key (32-byte x-only, or 33-byte compressed)</span><input id="pub" class="mono" spellcheck="false"></div>
    <div class="field"><span>Message</span>
      <div class="seg" id="mode">
        <button data-mode="hex" aria-pressed="true">Hex bytes</button>
        <button data-mode="sha256" aria-pressed="false">Text → SHA-256</button>
        <button data-mode="text" aria-pressed="false">Text (raw bytes)</button>
      </div>
      <textarea id="msg" class="mono" rows="2" spellcheck="false"></textarea>
    </div>
    <div class="field"><span>Signature (64 bytes hex)</span><textarea id="sig" class="mono" rows="2" spellcheck="false"></textarea></div>
    <p class="error" id="err" hidden></p>
    <p class="status" id="status" hidden></p>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { schnorr, sha256, utf8, hexToBytes, InputError } from '../lib/btc.js';
import { $, live, segmented } from '../lib/ui.js';

let run;
const mode = segmented($('mode'), () => run());
run = live([$('pub'), $('msg'), $('sig')], () => {
  $('status').hidden = true;
  if (!$('pub').value.trim() || !$('sig').value.trim()) return;
  let pub = hexToBytes($('pub').value, 'Public key');
  if (pub.length === 33) pub = pub.slice(1);
  if (pub.length !== 32) throw new InputError('Public key must be 32 bytes (x-only) or 33 bytes (compressed)');
  const sig = hexToBytes($('sig').value, 'Signature');
  if (sig.length !== 64) throw new InputError(`Signature must be 64 bytes; this is ${sig.length}`);
  const v = $('msg').value;
  const msg = mode() === 'hex' ? hexToBytes(v, 'Message') : mode() === 'sha256' ? sha256(utf8(v)) : utf8(v);
  let valid = false;
  try { valid = schnorr.verify(sig, msg, pub); } catch {}
  $('status').hidden = false;
  $('status').className = 'status ' + (valid ? 'ok' : 'bad');
  $('status').textContent = valid ? '✓ Valid BIP340 signature' : '✗ Invalid: the signature does not match this key and message (or the key is not on the curve)';
}, { errEl: $('err') });
</script>
</body>
</html>
