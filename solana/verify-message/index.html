<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Message</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%94%EF%B8%8F</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/sol.css">
  <style>
    .verdict { margin-top: 16px; font-size: 18px; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Solana</a>
  <h1>✔️ Verify Message</h1>
  <p class="lead">Check that an ed25519 signature over a message was made by a given Solana address.</p>

  <div class="panel">
    <label class="field">Public key (address)
      <input id="pub" class="mono" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">Message
      <textarea id="msg" class="wide" rows="4" spellcheck="false"></textarea>
    </label>
    <label class="field">Message encoding
      <select id="enc"><option value="utf8">Text (UTF-8)</option><option value="hex">Hex</option><option value="base58">Base58</option><option value="base64">Base64</option></select>
    </label>
    <label class="field">Signature (base58, hex or base64)
      <textarea id="sig" class="wide" rows="2" spellcheck="false" autocomplete="off"></textarea>
    </label>
    <p class="error" id="err" hidden></p>
    <div id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { ed25519, decodePubkey, parseBytes, base58, base64, hex, showError } from '../lib/sol.js';
const $ = id => document.getElementById(id);
function parseSig(s) {
  const t = s.trim().replace(/\s+/g, '');
  const tries = [
    () => /^(0x)?[0-9a-fA-F]{128}$/.test(t) ? hex.decode(t.replace(/^0x/, '').toLowerCase()) : null,
    () => base58.decode(t),
    () => base64.decode(t),
  ];
  for (const f of tries) { try { const b = f(); if (b && b.length === 64) return b; } catch {} }
  throw new Error('Signature must be 64 bytes, as base58, hex or base64.');
}
function render() {
  $('out').innerHTML = '';
  if (!$('pub').value.trim() || !$('sig').value.trim()) return showError($('err'));
  try {
    const pub = decodePubkey($('pub').value, 'Public key');
    const msg = parseBytes($('msg').value, $('enc').value);
    const sig = parseSig($('sig').value);
    let ok = false;
    try { ok = ed25519.verify(sig, msg, pub); } catch { ok = false; }
    showError($('err'));
    $('out').innerHTML = ok
      ? '<p class="verdict ok">✅ Valid: this address signed this message.</p>'
      : '<p class="verdict bad">❌ Invalid: the signature does not match this address and message.</p><p class="muted">Check the message encoding and that the message is byte-for-byte identical, including spaces and line breaks.</p>';
  } catch (e) { showError($('err'), e.message); }
}
['pub', 'msg', 'sig'].forEach(id => $(id).oninput = render);
$('enc').onchange = render;
</script>
</body>
</html>
