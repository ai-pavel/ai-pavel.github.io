<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%BE</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    .bits8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin: 4px 0 16px; text-align: center; }
    .bits8 button { padding: 8px 0; font: 600 20px ui-monospace, Menlo, monospace; display: flex; flex-direction: column; align-items: center; }
    .bits8 button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .bits8 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
    .bits8 button.on small { color: inherit; opacity: .8; }
    .forms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 12px; }
    @media (max-width: 640px) { .forms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .nav { display: flex; gap: 8px; margin-bottom: 14px; }
    .ascii { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
    .ascii button { padding: 6px 2px; font: 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; align-items: center; }
    .ascii button small { color: var(--muted); font-size: 11px; }
    .ascii button.sel { border-color: var(--accent); outline: 1px solid var(--accent); }
    @media (max-width: 480px) { .ascii { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    h2 { margin-top: 20px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>💾 Byte</h1>
  <p class="lead">Show every representation of a byte.</p>
  <!-- dev:body -->
  <div class="panel">
    <p class="muted">Edit any field; the others follow. Click a bit to flip it.</p>
    <div class="forms">
      <div class="field"><span>Binary</span><input id="bin" class="mono" autocomplete="off" inputmode="numeric"></div>
      <div class="field"><span>Hex</span><input id="hex" class="mono" autocomplete="off"></div>
      <div class="field"><span>Octal</span><input id="oct" class="mono" autocomplete="off" inputmode="numeric"></div>
      <div class="field"><span>Unsigned (0 … 255)</span><input id="dec" class="mono" autocomplete="off" inputmode="numeric"></div>
      <div class="field"><span>Signed (−128 … 127)</span><input id="sdec" class="mono" autocomplete="off"></div>
      <div class="field"><span>Character</span><input id="ch" class="mono" autocomplete="off" maxlength="2"></div>
    </div>
    <div class="nav"><button id="prev" title="Previous byte">− 1</button><button id="next" title="Next byte">+ 1</button></div>
    <p class="error" id="err" hidden></p>
    <div class="bits8" id="bits"></div>
    <div class="out" id="out"></div>
    <h2>ASCII table</h2>
    <div class="ascii" id="table"></div>
  </div>
  <script type="module">
import { $, renderRows, showError, InputError } from '../lib/ui.js';
import { parseInteger, charName, charDescription } from '../lib/num.js';

let current = 0x2a;
const PARSE = {
  bin: s => { s = s.replace(/^0b/i, '').replace(/[\s_]/g, ''); if (!/^[01]{1,8}$/.test(s)) throw new InputError('Binary: up to 8 digits of 0 and 1.'); return parseInt(s, 2); },
  hex: s => { s = s.replace(/^0x/i, ''); if (!/^[0-9a-f]{1,2}$/i.test(s)) throw new InputError('Hex: one or two digits 0-9, a-f.'); return parseInt(s, 16); },
  oct: s => { s = s.replace(/^0o/i, ''); if (!/^[0-7]{1,3}$/.test(s) || parseInt(s, 8) > 255) throw new InputError('Octal: 0 … 377.'); return parseInt(s, 8); },
  dec: s => { const v = Number(parseInteger(s, 10)); if (v < 0 || v > 255) throw new InputError('Unsigned byte: 0 … 255.'); return v; },
  sdec: s => { const v = Number(parseInteger(s, 10)); if (v < -128 || v > 127) throw new InputError('Signed byte: −128 … 127.'); return v & 0xff; },
  ch: s => {
    if (!s) throw new InputError('Type a character.');
    const cp = s.codePointAt(0);
    if (cp > 255) throw new InputError(`"${String.fromCodePoint(cp)}" (U+${cp.toString(16).toUpperCase().padStart(4, '0')}) doesn't fit in one byte. Its UTF-8 bytes: ${[...new TextEncoder().encode(String.fromCodePoint(cp))].map(x => x.toString(16).padStart(2, '0')).join(' ')}`);
    return cp;
  },
};
function show(b, except) {
  current = b;
  const values = { bin: b.toString(2).padStart(8, '0'), hex: b.toString(16).padStart(2, '0'), oct: b.toString(8), dec: String(b), sdec: String(b > 127 ? b - 256 : b), ch: b >= 32 && b !== 127 && !(b >= 128 && b < 160) ? String.fromCharCode(b) : '' };
  for (const k of Object.keys(values)) if (k !== except) $(k).value = values[k];
  $('bits').innerHTML = [...Array(8)].map((_, i) => { const bit = 7 - i, on = (b >> bit) & 1; return `<button data-bit="${bit}" class="${on ? 'on' : ''}" aria-pressed="${!!on}">${on}<small>${1 << bit}</small></button>`; }).join('');
  renderRows($('out'), [
    { label: 'Character', value: charDescription(b), copy: false },
    { label: 'Hex', value: '0x' + values.hex },
    { label: 'Binary', value: '0b' + values.bin },
    { label: 'Nibbles', value: `high ${b >> 4} (0x${(b >> 4).toString(16)}), low ${b & 15} (0x${(b & 15).toString(16)})`, copy: false },
    { label: 'Escape', value: b === 92 ? '\\\\' : b >= 32 && b < 127 ? String.fromCharCode(b) : '\\x' + values.hex },
    { label: 'HTML entity', value: '&#' + b + ';' },
    { label: 'URL-encoded', value: '%' + values.hex.toUpperCase() },
    { label: 'Set bits', value: String([...values.bin].filter(x => x === '1').length), copy: false },
    { label: 'Bits reversed', value: '0x' + parseInt([...values.bin].reverse().join(''), 2).toString(16).padStart(2, '0') },
    { label: 'Inverted (NOT)', value: '0x' + (~b & 0xff).toString(16).padStart(2, '0') },
  ]);
  document.querySelectorAll('#table button').forEach(x => x.classList.toggle('sel', +x.dataset.b === b));
}
for (const id of Object.keys(PARSE)) $(id).addEventListener('input', () => {
  try { const b = PARSE[id]($(id).value.trim() || (id === 'ch' ? '' : 'x')); showError($('err'), null); show(b, id); }
  catch (e) { showError($('err'), e); }
});
$('bits').addEventListener('click', e => { const b = e.target.closest('[data-bit]'); if (b) { showError($('err'), null); show(current ^ (1 << +b.dataset.bit)); } });
$('prev').onclick = () => { showError($('err'), null); show((current + 255) % 256); };
$('next').onclick = () => { showError($('err'), null); show((current + 1) % 256); };
$('table').innerHTML = Array.from({ length: 128 }, (_, b) =>
  `<button data-b="${b}" title="${charDescription(b).replace(/"/g, '&quot;')}">${charName(b).replace(/&/g, '&amp;').replace(/</g, '&lt;')}<small>${b} · ${b.toString(16).padStart(2, '0')}</small></button>`).join('');
$('table').addEventListener('click', e => { const t = e.target.closest('[data-b]'); if (t) { showError($('err'), null); show(+t.dataset.b); } });
show(current);
  </script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.0 MB</span></span>

</footer>
</body>
</html>
