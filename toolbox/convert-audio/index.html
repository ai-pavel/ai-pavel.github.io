<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 Convert Audio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%B5</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 28px 16px; border: 2px dashed var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; color: var(--muted);
    }
    .drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }
    .drop strong { color: var(--text); overflow-wrap: anywhere; }
    .drop input { display: none; }
    .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .settings input, .settings select { width: 100%; }
    progress { width: 100%; height: 10px; accent-color: var(--accent); }
    audio { width: 100%; margin-top: 12px; }
    a.btn { padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
  </style>
</head>
<body>
<main>
  <a class="back" href="../">← Utilities</a>
  <h1>🎵 Convert Audio</h1>
  <p class="lead">Convert audio between formats, or pull the soundtrack out of a video. Powered by ffmpeg running on your device.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="audio/*,video/*,.mkv,.flac,.opus,.ogg,.m4a,.aac,.wma,.aiff">
      <span style="font-size:32px">🎧</span>
      <strong id="dropTitle">Drop an audio or video file here or click to choose</strong>
      <span id="dropInfo">MP3, WAV, FLAC, OGG, M4A, AAC, MP4, MOV, MKV and more</span>
    </label>

    <div class="settings">
      <label>Format <select id="format">
        <option value="mp3">MP3</option>
        <option value="m4a">M4A (AAC)</option>
        <option value="ogg">OGG (Vorbis)</option>
        <option value="opus">Opus</option>
        <option value="flac">FLAC (lossless)</option>
        <option value="wav">WAV (uncompressed)</option>
      </select></label>
      <label id="bitrateLabel">Bitrate <select id="bitrate">
        <option value="96">96 kbps</option>
        <option value="128">128 kbps</option>
        <option value="192" selected>192 kbps</option>
        <option value="256">256 kbps</option>
        <option value="320">320 kbps</option>
      </select></label>
      <label>Trim start <input id="start" placeholder="0:00" inputmode="decimal"></label>
      <label>Trim end <input id="end" placeholder="end" inputmode="decimal"></label>
    </div>
    <p class="muted">Times can be seconds (<code>75</code>) or minutes:seconds (<code>1:15</code>). Leave empty to keep the whole file.</p>

    <div class="row" style="margin-top:8px">
      <button class="primary" id="convert" disabled>Convert</button>
      <button id="cancel" hidden>Cancel</button>
      <span class="muted" id="status"></span>
    </div>
    <progress id="progress" max="1" value="0" hidden style="margin-top:12px"></progress>

    <div id="result" hidden style="margin-top:16px">
      <audio id="player" controls></audio>
      <div class="row" style="margin-top:12px">
        <a class="btn" id="download">Download</a>
        <span class="muted" id="resultInfo"></span>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser.</span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { Converter, CancelledError, parseTime, formatBytes, escapeHTML } from '../vendor/ffmpeg/loader.js';

const $ = id => document.getElementById(id);
const CODECS = {
  mp3: { args: ['-c:a', 'libmp3lame'], bitrate: true, mime: 'audio/mpeg' },
  m4a: { args: ['-c:a', 'aac'], bitrate: true, mime: 'audio/mp4' },
  ogg: { args: ['-c:a', 'libvorbis'], bitrate: true, mime: 'audio/ogg' },
  opus: { args: ['-c:a', 'libopus'], bitrate: true, mime: 'audio/ogg' },
  flac: { args: ['-c:a', 'flac'], bitrate: false, mime: 'audio/flac' },
  wav: { args: ['-c:a', 'pcm_s16le'], bitrate: false, mime: 'audio/wav' },
};
const converter = new Converter();
let file = null, duration = 0, resultURL = null, busy = false;

function setFile(f) {
  if (!f) return;
  file = f; duration = 0;
  $('dropTitle').textContent = f.name;
  $('dropInfo').textContent = formatBytes(f.size) + ' · click to choose another file';
  // The browser may know the duration; it only improves the progress bar.
  const probe = document.createElement('video'), url = URL.createObjectURL(f);
  probe.preload = 'metadata';
  probe.onloadedmetadata = () => { if (isFinite(probe.duration)) duration = probe.duration; URL.revokeObjectURL(url); };
  probe.onerror = () => URL.revokeObjectURL(url);
  probe.src = url;
  $('convert').disabled = busy;
  $('status').textContent = '';
}

$('file').onchange = e => { setFile(e.target.files[0]); e.target.value = ''; };
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); setFile(e.dataTransfer.files[0]); };

const syncBitrate = () => { const b = CODECS[$('format').value].bitrate; $('bitrate').disabled = !b; $('bitrateLabel').style.opacity = b ? 1 : 0.4; };
$('format').onchange = syncBitrate;

$('convert').onclick = async () => {
  const fmt = $('format').value, codec = CODECS[fmt];
  const start = parseTime($('start').value), end = parseTime($('end').value);
  if ($('start').value.trim() && start === null || $('end').value.trim() && end === null) { $('status').textContent = 'Check the trim times.'; return; }
  if (start !== null && end !== null && end <= start) { $('status').textContent = 'Trim end must be after the start.'; return; }
  const outName = 'output.' + fmt;
  const length = (end ?? duration) - (start ?? 0);

  busy = true; $('convert').disabled = true; $('cancel').hidden = false; $('progress').hidden = false; $('result').hidden = true;
  try {
    const data = await converter.run({
      file, outName, duration: length > 0 ? length : 0,
      buildArgs: input => [
        ...(start !== null ? ['-ss', String(start)] : []),
        '-i', input,
        ...(end !== null ? ['-t', String(end - (start ?? 0))] : []),
        '-vn', '-map_metadata', '0',
        ...codec.args,
        ...(codec.bitrate ? ['-b:a', $('bitrate').value + 'k'] : []),
        outName,
      ],
      onStage: s => $('status').textContent = s === 'loading' ? 'Loading converter (~32 MB, only once)…' : 'Converting…',
      onProgress: p => $('progress').value = p,
    });
    if (resultURL) URL.revokeObjectURL(resultURL);
    const blob = new Blob([data], { type: codec.mime });
    resultURL = URL.createObjectURL(blob);
    const name = file.name.replace(/\.[^.]+$/, '') + '.' + fmt;
    $('player').src = resultURL;
    $('download').href = resultURL; $('download').download = name;
    $('resultInfo').innerHTML = `${escapeHTML(name)} · ${formatBytes(blob.size)}`;
    $('result').hidden = false; $('status').textContent = 'Done.';
  } catch (err) {
    $('status').textContent = err instanceof CancelledError ? 'Cancelled.' : 'Failed: ' + err.message;
  } finally {
    busy = false; $('convert').disabled = !file; $('cancel').hidden = true; $('progress').hidden = true;
  }
};
$('cancel').onclick = () => converter.cancel();
syncBitrate();
</script>
</body>
</html>
