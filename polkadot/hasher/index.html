<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%80</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/dot.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Polkadot</a>
  <h1>🌀 Hasher</h1>
  <p class="lead">Hash text or hex with the functions Substrate uses: Blake2, xxHash (Twox), Keccak and SHA-256, plus the Concat variants used in storage keys.</p>
<!-- tool -->
  <div class="panel">
    <div class="row">
      <label class="check"><input type="radio" name="enc" value="text" checked> Text (UTF-8)</label>
      <label class="check"><input type="radio" name="enc" value="hex"> Hex</label>
    </div>
    <label class="field">Input
      <textarea id="in" class="wide" rows="3" spellcheck="false">Balances</textarea>
    </label>
    <div class="row"><button type="button" id="example">Example: "System"</button></div>
    <p class="error" id="err" hidden></p>
    <div id="out"></div>
  </div>
<script type="module">
import { $, kv, showError } from '../lib/ui.js';
import { utf8, fromHex, toHex, blake2, twox, keccak_256, sha256, concat, blake2b } from '../lib/dot.js';
import { blake2s } from '../../assets/vendor/@noble/hashes@2.4.0/blake2.esm.js';
function render() {
  try {
    const enc = document.querySelector('input[name=enc]:checked').value;
    const data = enc === 'hex' ? fromHex($('in').value, 'input') : utf8($('in').value);
    showError($('err'), null);
    $('out').innerHTML = kv([
      ['Bytes', toHex(data), { note: `${data.length} bytes` }],
      ['Blake2b-128', toHex(blake2(data, 128))],
      ['Blake2b-256', toHex(blake2(data, 256)), { note: 'blake2_256: account ids, multisig, hashing in runtimes' }],
      ['Blake2b-512', toHex(blake2(data, 512))],
      ['Blake2s-256', toHex(blake2s(data))],
      ['Twox64', toHex(twox(data, 64))],
      ['Twox128', toHex(twox(data, 128)), { note: 'used for pallet and storage item names' }],
      ['Twox256', toHex(twox(data, 256))],
      ['Blake2_128Concat', toHex(concat(blake2(data, 128), data)), { note: 'Blake2b-128 followed by the input' }],
      ['Twox64Concat', toHex(concat(twox(data, 64), data)), { note: 'Twox64 followed by the input' }],
      ['Keccak-256', toHex(keccak_256(data))],
      ['SHA-256', toHex(sha256(data))],
    ]);
  } catch (e) { showError($('err'), e); $('out').innerHTML = ''; }
}
$('in').addEventListener('input', render);
document.querySelectorAll('input[name=enc]').forEach(r => r.addEventListener('input', render));
render();
// Example button(s)
$('example').onclick = () => { document.querySelector('input[name=enc][value=text]').checked = true; $('in').value = 'System'; render(); };
</script>
<!-- /tool -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 4.3 MB</span></span>

</body>
</html>
