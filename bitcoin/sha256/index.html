<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHA-256</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%92</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../lib/btc.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<main>
  <a class="back" href="../">← Bitcoin</a>
  <h1>🔒 SHA-256</h1>
  <p class="lead">Hash text or hex bytes with a single SHA-256.</p>

  <div class="panel">
    <div class="seg" id="mode">
      <button data-mode="text" aria-pressed="true">Text (UTF-8)</button>
      <button data-mode="hex" aria-pressed="false">Hex bytes</button>
    </div>
    <div class="field">
      <textarea id="input" class="mono" rows="4" spellcheck="false" placeholder="Type or paste input"></textarea>
    </div>
    <p class="error" id="err" hidden></p>
    <div class="out" id="out"></div>
  </div>
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 2.7 MB</span></span>
  <a href="https://github.com/ai-pavel/ai-pavel.github.io">Source on GitHub</a>
</footer>
<script type="module">
import { sha256, bytesToHex, reverse, readInput } from '../lib/btc.js';
import { $, renderRows, live, segmented } from '../lib/ui.js';

let run;
const mode = segmented($('mode'), () => run());
run = live([$('input')], () => {
  const bytes = readInput($('input').value, mode());
  const h = sha256(bytes);
  renderRows($('out'), [
    { label: 'SHA-256', value: bytesToHex(h) },
    { label: 'Reversed', value: bytesToHex(reverse(h)), note: 'Byte order used when a hash is shown as a little-endian number' },
    { label: 'Input size', value: `${bytes.length} bytes`, copy: false },
  ]);
}, { errEl: $('err'), outEl: $('out') });
</script>
</body>
</html>
