<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTTP Status Codes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%9A%A6</text></svg>">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
  <script src="/assets/pwa.js" defer></script>
  <!-- dev:head -->
  <link rel="stylesheet" href="../lib/dev.css">
  <style>
    .codes { display: grid; gap: 6px; margin-top: 12px; }
    .code { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .code summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
    .code summary::-webkit-details-marker { display: none; }
    .code .n { font: 700 16px ui-monospace, Menlo, monospace; min-width: 2.6em; }
    .code .c1 { color: var(--muted); } .code .c2 { color: var(--ok); } .code .c3 { color: var(--accent); } .code .c4 { color: var(--warn); } .code .c5 { color: var(--bad); }
    .code p { margin: 8px 0 0; font-size: 14px; }
    .code .ref { color: var(--muted); font-size: 13px; }
  </style>
  <!-- /dev:head -->
</head>
<body>
<main>
  <a class="back" href="../">← Developer</a>
  <h1>🚦 HTTP Status Codes</h1>
  <p class="lead">Look up HTTP status codes.</p>
  <!-- dev:body -->
  <div class="panel">
    <div class="field"><span>Search by code or words</span><input id="q" autocomplete="off" placeholder="e.g. 404, redirect, rate limit"></div>
    <div class="toolbar"><label>Class <select id="cls"><option value="">All</option><option value="1">1xx Informational</option><option value="2">2xx Success</option><option value="3">3xx Redirection</option><option value="4">4xx Client error</option><option value="5">5xx Server error</option></select></label><span class="muted" id="count"></span></div>
    <div class="codes" id="list"></div>
  </div>
  <script type="module">
import { $, esc } from '../lib/ui.js';

// [code, name, meaning, typical use, spec]
const CODES = [
  [100, 'Continue', 'The server got the request headers; the client should send the body.', 'Sent in reply to "Expect: 100-continue" before a large upload.', 'RFC 9110'],
  [101, 'Switching Protocols', 'The server is switching to the protocol named in the Upgrade header.', 'Upgrading an HTTP connection to WebSocket.', 'RFC 9110'],
  [102, 'Processing', 'The server accepted the request and is still working on it.', 'Long WebDAV operations (deprecated).', 'RFC 2518'],
  [103, 'Early Hints', 'Preliminary headers sent before the final response.', 'Link: rel=preload hints so the browser fetches assets early.', 'RFC 8297'],
  [200, 'OK', 'The request succeeded.', 'Normal response to GET, or to POST with a result body.', 'RFC 9110'],
  [201, 'Created', 'A new resource was created.', 'After POST/PUT creating something; Location points to it.', 'RFC 9110'],
  [202, 'Accepted', 'Accepted for processing, not finished yet.', 'Queued or asynchronous jobs.', 'RFC 9110'],
  [203, 'Non-Authoritative Information', 'The payload was changed by a transforming proxy.', 'Rare; proxies that modify responses.', 'RFC 9110'],
  [204, 'No Content', 'Success, with no body.', 'DELETE, or PUT/PATCH that returns nothing.', 'RFC 9110'],
  [205, 'Reset Content', 'Success; the client should reset the document view.', 'Clearing a form after submission (rare).', 'RFC 9110'],
  [206, 'Partial Content', 'Only part of the resource is returned, as asked by Range.', 'Resumable downloads and video seeking.', 'RFC 9110'],
  [207, 'Multi-Status', 'Several status codes for several resources.', 'WebDAV batch operations.', 'RFC 4918'],
  [208, 'Already Reported', 'Members of a binding were already listed.', 'WebDAV, avoids repeating members.', 'RFC 5842'],
  [226, 'IM Used', 'The response is the result of instance manipulations.', 'Delta encoding (rare).', 'RFC 3229'],
  [300, 'Multiple Choices', 'Several representations are available.', 'Content negotiation with a list of options (rare).', 'RFC 9110'],
  [301, 'Moved Permanently', 'The resource has a new permanent URL.', 'Permanent redirects; clients may change POST to GET.', 'RFC 9110'],
  [302, 'Found', 'The resource is temporarily at another URL.', 'Temporary redirects (method may change to GET).', 'RFC 9110'],
  [303, 'See Other', 'Get the result from another URL with GET.', 'Post/Redirect/Get after a form submission.', 'RFC 9110'],
  [304, 'Not Modified', 'The cached copy is still valid.', 'Conditional GET with If-None-Match / If-Modified-Since.', 'RFC 9110'],
  [305, 'Use Proxy', 'Must be accessed through a proxy.', 'Deprecated for security reasons.', 'RFC 9110'],
  [307, 'Temporary Redirect', 'Temporarily at another URL; keep the same method and body.', 'Temporary redirects that must not change POST to GET.', 'RFC 9110'],
  [308, 'Permanent Redirect', 'Permanently at another URL; keep the same method and body.', 'Permanent API moves that must keep the method.', 'RFC 9110'],
  [400, 'Bad Request', 'The request is malformed or invalid.', 'Invalid JSON, missing fields, bad parameters.', 'RFC 9110'],
  [401, 'Unauthorized', 'Authentication is required or failed.', 'Missing or invalid credentials; sent with WWW-Authenticate.', 'RFC 9110'],
  [402, 'Payment Required', 'Reserved for payment.', 'Some APIs use it for exhausted quota or billing problems.', 'RFC 9110'],
  [403, 'Forbidden', 'Authenticated (or not), but not allowed.', 'Valid credentials without permission for this resource.', 'RFC 9110'],
  [404, 'Not Found', 'No resource at this URL.', 'Unknown paths or IDs; also to hide that something exists.', 'RFC 9110'],
  [405, 'Method Not Allowed', 'This method is not supported here.', 'POST to a read-only endpoint; Allow lists valid methods.', 'RFC 9110'],
  [406, 'Not Acceptable', 'No representation matches the Accept headers.', 'Client asked for a format the server can\'t produce.', 'RFC 9110'],
  [407, 'Proxy Authentication Required', 'The proxy needs authentication.', 'Corporate proxies.', 'RFC 9110'],
  [408, 'Request Timeout', 'The client took too long to send the request.', 'Idle connections closed by the server.', 'RFC 9110'],
  [409, 'Conflict', 'The request conflicts with the current state.', 'Edit conflicts, duplicates, version mismatches.', 'RFC 9110'],
  [410, 'Gone', 'The resource was removed permanently.', 'Deleted content that won\'t come back.', 'RFC 9110'],
  [411, 'Length Required', 'Content-Length is required.', 'Servers that refuse chunked uploads.', 'RFC 9110'],
  [412, 'Precondition Failed', 'A conditional header did not match.', 'If-Match failed: optimistic locking.', 'RFC 9110'],
  [413, 'Content Too Large', 'The body is larger than the server accepts.', 'Upload size limits.', 'RFC 9110'],
  [414, 'URI Too Long', 'The URL is longer than the server accepts.', 'Huge query strings; use POST instead.', 'RFC 9110'],
  [415, 'Unsupported Media Type', 'The body format isn\'t supported.', 'Wrong Content-Type, e.g. form data to a JSON API.', 'RFC 9110'],
  [416, 'Range Not Satisfiable', 'The requested range is outside the resource.', 'Range header beyond the file size.', 'RFC 9110'],
  [417, 'Expectation Failed', 'The Expect header can\'t be met.', 'Servers that don\'t support 100-continue.', 'RFC 9110'],
  [418, "I'm a teapot", 'The server refuses to brew coffee because it is a teapot.', 'An April Fools\' joke; sometimes used for blocked bots.', 'RFC 2324'],
  [421, 'Misdirected Request', 'The request went to a server that can\'t answer for this host.', 'HTTP/2 connection reuse across hostnames.', 'RFC 9110'],
  [422, 'Unprocessable Content', 'Well-formed, but semantically invalid.', 'Validation errors in APIs.', 'RFC 9110'],
  [423, 'Locked', 'The resource is locked.', 'WebDAV locks.', 'RFC 4918'],
  [424, 'Failed Dependency', 'Failed because a previous request failed.', 'WebDAV batch operations.', 'RFC 4918'],
  [425, 'Too Early', 'The server won\'t risk processing a replayable request.', 'TLS 1.3 early data (0-RTT).', 'RFC 8470'],
  [426, 'Upgrade Required', 'The client must switch protocols.', 'Requiring TLS or a newer HTTP version.', 'RFC 9110'],
  [428, 'Precondition Required', 'The request must be conditional.', 'Forcing If-Match to prevent lost updates.', 'RFC 6585'],
  [429, 'Too Many Requests', 'Rate limit exceeded.', 'API throttling; Retry-After says when to retry.', 'RFC 6585'],
  [431, 'Request Header Fields Too Large', 'Headers are too large.', 'Huge cookies or tokens.', 'RFC 6585'],
  [451, 'Unavailable For Legal Reasons', 'Blocked for legal reasons.', 'Court orders or censorship.', 'RFC 7725'],
  [500, 'Internal Server Error', 'An unexpected error on the server.', 'Unhandled exceptions and bugs.', 'RFC 9110'],
  [501, 'Not Implemented', 'The server doesn\'t support this functionality.', 'Unknown HTTP methods.', 'RFC 9110'],
  [502, 'Bad Gateway', 'A gateway got an invalid response upstream.', 'Proxy or load balancer can\'t reach a healthy backend.', 'RFC 9110'],
  [503, 'Service Unavailable', 'Temporarily unable to handle the request.', 'Overload or maintenance; may include Retry-After.', 'RFC 9110'],
  [504, 'Gateway Timeout', 'A gateway didn\'t get a response in time.', 'Slow backends behind a proxy.', 'RFC 9110'],
  [505, 'HTTP Version Not Supported', 'The HTTP version isn\'t supported.', 'Very old or very new protocol versions.', 'RFC 9110'],
  [506, 'Variant Also Negotiates', 'Content negotiation is misconfigured.', 'Circular negotiation (rare).', 'RFC 2295'],
  [507, 'Insufficient Storage', 'The server can\'t store what\'s needed.', 'WebDAV, full disks.', 'RFC 4918'],
  [508, 'Loop Detected', 'An infinite loop was detected.', 'WebDAV binding loops.', 'RFC 5842'],
  [510, 'Not Extended', 'Further extensions are required.', 'Obsolete.', 'RFC 2774'],
  [511, 'Network Authentication Required', 'The network needs you to log in.', 'Captive portals in hotels and airports.', 'RFC 6585'],
];
const CLASS = { 1: 'Informational', 2: 'Success', 3: 'Redirection', 4: 'Client error', 5: 'Server error' };
function render() {
  const q = $('q').value.trim().toLowerCase(), cls = $('cls').value;
  const hits = CODES.filter(([n, name, meaning, use]) =>
    (!cls || String(n)[0] === cls) && (!q || String(n).startsWith(q) || `${name} ${meaning} ${use}`.toLowerCase().includes(q)));
  $('count').textContent = `${hits.length} code${hits.length === 1 ? '' : 's'}`;
  $('list').innerHTML = hits.map(([n, name, meaning, use, ref]) => `<details class="code"${hits.length <= 3 ? ' open' : ''}>
    <summary><span class="n c${String(n)[0]}">${n}</span><strong>${esc(name)}</strong></summary>
    <p>${esc(meaning)}</p><p><span class="muted">Typical use:</span> ${esc(use)}</p>
    <p class="ref">${CLASS[String(n)[0]]} · ${esc(ref)}</p></details>`).join('') || '<p class="muted">No matching codes.</p>';
}
$('q').addEventListener('input', render);
$('cls').addEventListener('input', render);
render();
  </script>
  <!-- /dev:body -->
</main>
<footer class="site-footer">
  <span>Runs entirely in your browser and works offline · <span title="Not counting the video converter and OCR engines, which download on first use.">Whole site: 3.9 MB</span></span>

</body>
</html>
